alert_policies:
  - display_name: RegenExcalibur Cloud Run 5xx Errors
    combiner: OR
    conditions:
      - display_name: Cloud Run 5xx response count
        condition_threshold:
          filter: metric.type="run.googleapis.com/request_count" AND resource.type="cloud_run_revision" AND metric.label.response_code_class="5xx"
          comparison: COMPARISON_GT
          threshold_value: 5
          duration: 300s
          aggregations:
            - alignment_period: 60s
              per_series_aligner: ALIGN_RATE

  - display_name: RegenExcalibur Pub/Sub Backlog
    combiner: OR
    conditions:
      - display_name: Agent task backlog above threshold
        condition_threshold:
          filter: metric.type="pubsub.googleapis.com/subscription/num_undelivered_messages"
          comparison: COMPARISON_GT
          threshold_value: 100
          duration: 600s
          aggregations:
            - alignment_period: 60s
              per_series_aligner: ALIGN_MAX

  - display_name: RegenExcalibur Function Execution Errors
    combiner: OR
    conditions:
      - display_name: Function execution errors
        condition_threshold:
          filter: metric.type="cloudfunctions.googleapis.com/function/execution_count" AND metric.label.status!="ok"
          comparison: COMPARISON_GT
          threshold_value: 3
          duration: 300s
          aggregations:
            - alignment_period: 60s
              per_series_aligner: ALIGN_RATE
