name: ProofGrid v0.8 Reference Closure Probe

on:
  pull_request:
    paths:
      - ".github/workflows/proofgrid-v08-reference-closure-probe.yml"
      - "conformance/oekobaudat-v12/OekobaudatProfileProbe.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-reference-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Java 17
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout pinned InData v1.2 samples
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData master data
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Master-Data
          ref: 32117b6a70d6c486344247a429449755a2c7eab4
          path: .proofgrid-upstream/indata-master
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact official validator and profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proofgrid-v08-closure
          cat > /tmp/proofgrid-v08-closure/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>proofgrid.v08</groupId>
            <artifactId>closure-probe</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency><groupId>com.okworx.ilcd.validation</groupId><artifactId>ilcd-validation</artifactId><version>2.12.2</version></dependency>
              <dependency><groupId>com.okworx.ilcd.validation.profiles</groupId><artifactId>EPD-1.2-OEKOBAUDAT</artifactId><version>3.8.0</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -B -ntp -f /tmp/proofgrid-v08-closure/pom.xml dependency:go-offline
          mvn -B -ntp -f /tmp/proofgrid-v08-closure/pom.xml dependency:build-classpath \
            -Dmdep.outputFile=/tmp/proofgrid-v08-closure/classpath.txt -Dmdep.pathSeparator=:
          LIB="$HOME/.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2/ilcd-validation-2.12.2.jar"
          PROFILE="$HOME/.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0/EPD-1.2-OEKOBAUDAT-3.8.0.jar"
          test "$(sha256sum "$LIB" | awk '{print $1}')" = "55427919601b5deceee99b34fbbbaf8f00cbcf0aca1fdb1eb493c31f473e077b"
          test "$(sha256sum "$PROFILE" | awk '{print $1}')" = "96ee05b9cf5172a344df3ea844aa8d94060eae4e4e8188f72e46441a3d61921e"
          printf '%s\n' "$PROFILE" > /tmp/proofgrid-v08-closure/profile-path.txt
          CP=$(cat /tmp/proofgrid-v08-closure/classpath.txt)
          mkdir -p /tmp/proofgrid-v08-closure/classes
          javac -encoding UTF-8 -cp "$CP" -d /tmp/proofgrid-v08-closure/classes conformance/oekobaudat-v12/OekobaudatProfileProbe.java

      - name: Build recursive dependency closure for Wood panel process
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil, xml.etree.ElementTree as ET

          ws = Path.cwd()
          sample = ws / '.proofgrid-upstream/indata-v12/sample_data'
          master = ws / '.proofgrid-upstream/indata-master'
          out = Path('/tmp/proofgrid-v08-closure')
          pkg = out / 'package/ILCD'
          pkg.mkdir(parents=True, exist_ok=True)

          roots = [sample, master]
          index = {}
          duplicates = {}
          parse_errors = []

          def local(tag):
              return tag.rsplit('}', 1)[-1] if '}' in tag else tag

          def dataset_uuid(path):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  parse_errors.append({'path': str(path), 'error': str(exc)})
                  return None, None
              candidates=[]
              for node in root.iter():
                  if local(node.tag) == 'UUID' and node.text and node.text.strip():
                      candidates.append(node.text.strip())
              return (candidates[0] if candidates else None), local(root.tag)

          def type_dir(root_name):
              mapping={
                'processDataSet':'processes','flowDataSet':'flows','flowPropertyDataSet':'flowproperties',
                'unitGroupDataSet':'unitgroups','contactDataSet':'contacts','sourceDataSet':'sources',
                'LCIAMethodDataSet':'lciamethods','lifeCycleModelDataSet':'lifecyclemodels',
              }
              return mapping.get(root_name, 'misc')

          for root in roots:
              for path in root.rglob('*.xml'):
                  uuid, kind = dataset_uuid(path)
                  if not uuid: continue
                  row={'path':path,'kind':kind,'source_root':root}
                  if uuid in index:
                      duplicates.setdefault(uuid,[index[uuid]]).append(row)
                      # Prefer sample-data objects over master data when both exist.
                      if index[uuid]['source_root'] != sample and root == sample:
                          index[uuid]=row
                  else:
                      index[uuid]=row

          start_uuid='57a4ae65-d305-421e-b21f-a3f0c35b8abe'
          if start_uuid not in index:
              raise SystemExit('start process UUID not found')

          queue=[start_uuid]
          seen=set()
          missing=set()
          copied=[]
          relative_files=set()

          while queue:
              uuid=queue.pop(0)
              if uuid in seen: continue
              seen.add(uuid)
              row=index.get(uuid)
              if row is None:
                  missing.add(uuid)
                  continue
              src=row['path']
              dst=pkg/type_dir(row['kind'])/src.name
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              copied.append({'uuid':uuid,'kind':row['kind'],'source':str(src),'dest':str(dst.relative_to(pkg.parent))})

              tree=ET.parse(src)
              root=tree.getroot()
              for node in root.iter():
                  ref=node.attrib.get('refObjectId')
                  if ref and ref not in seen:
                      if ref in index: queue.append(ref)
                      else: missing.add(ref)
                  for attr in ('locations','classes'):
                      val=node.attrib.get(attr)
                      if not val: continue
                      candidate=(src.parent/val).resolve()
                      if candidate.is_file():
                          try:
                              rel=candidate.relative_to(sample.resolve())
                          except Exception:
                              continue
                          target=pkg/rel
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copy2(candidate,target)
                          relative_files.add(str(rel))

          receipt={
            'start_uuid':start_uuid,
            'copied_count':len(copied),
            'copied':copied,
            'missing_refObjectIds':sorted(missing),
            'relative_support_files':sorted(relative_files),
            'duplicate_uuid_count':len(duplicates),
            'parse_error_count':len(parse_errors),
          }
          (out/'closure-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Run official ÖKOBAUDAT profile on closure only
        shell: bash
        run: |
          set -euo pipefail
          CP=$(cat /tmp/proofgrid-v08-closure/classpath.txt):/tmp/proofgrid-v08-closure/classes
          PROFILE=$(cat /tmp/proofgrid-v08-closure/profile-path.txt)
          mkdir -p /tmp/proofgrid-v08-closure/results
          java -Djava.net.useSystemProxies=false -cp "$CP" \
            proofgrid.v08.OekobaudatProfileProbe \
            "$PROFILE" /tmp/proofgrid-v08-closure/package /tmp/proofgrid-v08-closure/results/closure.json closure-wood-panel

      - name: Summarize residual official errors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import collections, hashlib, json
          root=Path('/tmp/proofgrid-v08-closure')
          result=json.loads((root/'results/closure.json').read_text())
          errors=[e for e in result['events'] if e.get('severity')=='ERROR']
          warnings=[e for e in result['events'] if e.get('severity')=='WARNING']
          grouped=collections.Counter((e.get('aspect'),e.get('message')) for e in errors)
          summary={
            'baseline_source':'Pinned public InData v1.2 Wood panel process plus recursively resolved public sample/master-data dependencies only.',
            'profile':'EPD 1.2 ÖKOBAUDAT 3.8.0',
            'official_library':'ilcd-validation 2.12.2',
            'positive':result['is_positive'],
            'errors':len(errors),
            'warnings':len(warnings),
            'events':result['event_count'],
            'error_groups':[{'count':n,'aspect':k[0],'message':k[1]} for k,n in grouped.most_common()],
            'events_sha256':hashlib.sha256((json.dumps(result['events'],sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest(),
          }
          payload=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['receipt_sha256']=hashlib.sha256(payload).hexdigest()
          (root/'closure-profile-receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Retain closure receipts and official event result
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v08-reference-closure-probe
          path: |
            /tmp/proofgrid-v08-closure/closure-receipt.json
            /tmp/proofgrid-v08-closure/closure-profile-receipt.json
            /tmp/proofgrid-v08-closure/results/closure.json
          if-no-files-found: error
          retention-days: 30
