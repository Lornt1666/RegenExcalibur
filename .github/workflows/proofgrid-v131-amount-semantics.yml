name: ProofGrid v1.3.1 Amount Semantics

on:
  pull_request:
    paths:
      - "reference/reference_exchange_amount_semantics.py"
      - "schemas/reference-exchange-amount-semantics.schema.json"
      - "tests/test_reference_exchange_amount_semantics.py"
      - "conformance/reference-amount-semantics-v131/**"
      - ".github/workflows/proofgrid-v131-amount-semantics.yml"
      - "requirements-proofgrid.txt"
      - "requirements-proofgrid-v07.txt"

permissions:
  contents: read

jobs:
  amount-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proofgrid.txt
          python -m pip install -r requirements-proofgrid-v07.txt
          python -m pip check

      - name: Run v1.3.1 fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_reference_exchange_amount_semantics

      - name: Checkout pinned InData v1.2 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData v1.3 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: 7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa
          path: .proofgrid-upstream/indata-v13
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable upstream commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .proofgrid-upstream/indata-v12 rev-parse HEAD)" = "b7233bd2dd5435a6b5973505ffa212cd03d23468"
          test "$(git -C .proofgrid-upstream/indata-v13 rev-parse HEAD)" = "7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa"

      - name: Prove pinned v1.2 and v1.3 amount semantics twice
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v131
          mkdir -p "$OUT/a" "$OUT/b"
          python - <<'PY'
          from pathlib import Path
          import json
          from reference.reference_exchange_amount_semantics import inspect_process_bytes,enforce_policy

          cases={
            'v12':('1.2',Path('.proofgrid-upstream/indata-v12/sample_data/processes/57a4ae65-d305-421e-b21f-a3f0c35b8abe.xml')),
            'v13':('1.3',Path('.proofgrid-upstream/indata-v13/sample_data/processes/EPDv1.3_example_57a4ae65-d305-421e-b21f-a3f0c35b8abe.xml')),
          }
          for repeat in ('a','b'):
            for key,(version,path) in cases.items():
              evidence=inspect_process_bytes(path.read_bytes(),version)
              enforce_policy(evidence)
              assert evidence['reference_exchange_internal_id']=='42'
              assert evidence['mean_amount']=={'lexical':'1.0','decimal':'1'}
              assert evidence['resulting_amount_present'] is False
              assert evidence['resulting_amount'] is None
              target=Path('/tmp/proofgrid-v131')/repeat/f'{key}.json'
              target.write_text(json.dumps(evidence,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8',newline='\n')
          PY
          diff -u "$OUT/a/v12.json" "$OUT/b/v12.json"
          diff -u "$OUT/a/v13.json" "$OUT/b/v13.json"

      - name: Require controlled resultingAmount mutation to fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from reference.reference_exchange_amount_semantics import inspect_process_bytes,enforce_policy,AmountSemanticsError

          src=Path('.proofgrid-upstream/indata-v13/sample_data/processes/EPDv1.3_example_57a4ae65-d305-421e-b21f-a3f0c35b8abe.xml')
          root=ET.fromstring(src.read_bytes())
          exchange=next(x for x in root.iter() if x.tag.rsplit('}',1)[-1]=='exchange' and x.attrib.get('dataSetInternalID')=='42')
          children=list(exchange)
          mean=next(x for x in children if x.tag.rsplit('}',1)[-1]=='meanAmount')
          namespace=mean.tag.rsplit('}',1)[0]+'}' if '}' in mean.tag else ''
          resulting=ET.Element(namespace+'resultingAmount')
          resulting.text='1.0'
          exchange.insert(children.index(mean)+1,resulting)
          raw=ET.tostring(root,encoding='utf-8',xml_declaration=True)
          evidence=inspect_process_bytes(raw,'1.3')
          assert evidence['resulting_amount_present'] is True
          assert evidence['resulting_amount']=={'lexical':'1.0','decimal':'1'}
          try:
            enforce_policy(evidence)
          except AmountSemanticsError as exc:
            assert 'explicit amount-selection semantics' in str(exc)
            print('RESULTING_AMOUNT_REJECTED=PASS')
          else:
            raise SystemExit('resultingAmount mutation unexpectedly accepted')
          PY

      - name: Build bounded integration receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/proofgrid-v131')
          report={
            'verdict':'REFERENCE_EXCHANGE_AMOUNT_SEMANTICS_RESOLVED_VERIFIABLE',
            'accepted_parent_v13_head':'77931d81ae9857eb33b3cecaf8f9180f0c2b7e4a',
            'v12_evidence_file_sha256':hashlib.sha256((root/'a/v12.json').read_bytes()).hexdigest(),
            'v13_evidence_file_sha256':hashlib.sha256((root/'a/v13.json').read_bytes()).hexdigest(),
            'independent_repeat_within_run':True,
            'resulting_amount_absent_in_pinned_v12':True,
            'resulting_amount_absent_in_pinned_v13':True,
            'controlled_resulting_amount_rejected':True,
            'selection_policy':'MEAN_AMOUNT_ACCEPTED_ONLY_WHEN_RESULTING_AMOUNT_ABSENT',
            'building_quantity_multiplication_permitted':False,
            'calculated':False,
            'environmental_values_transformed':False,
            'unit_conversion_performed':False,
            'scientific_validation_performed':False,
            'professional_review_performed':False,
            'certified':False,
          }
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          report['receipt_sha256']=hashlib.sha256(canonical).hexdigest()
          (root/'v131-integration-receipt.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Retain bounded evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v131-amount-semantics
          path: |
            /tmp/proofgrid-v131/a/v12.json
            /tmp/proofgrid-v131/a/v13.json
            /tmp/proofgrid-v131/v131-integration-receipt.json
          if-no-files-found: error
          retention-days: 30
