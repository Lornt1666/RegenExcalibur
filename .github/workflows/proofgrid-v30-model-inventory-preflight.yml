name: ProofGrid v3.0 Model Inventory Engine Preflight

on:
  pull_request:
    paths:
      - "reference/model_inventory_v30.py"
      - "policies/inventory-policy-v30.json"
      - "schemas/model-source-authorization-v30.schema.json"
      - "schemas/model-inventory-basis-v30.schema.json"
      - "tests/test_model_inventory_v30.py"
      - "conformance/model-inventory-v30/**"
      - ".github/workflows/proofgrid-v30-model-inventory-preflight.yml"
      - "requirements-proofgrid.txt"

permissions:
  contents: read
  actions: read

jobs:
  preflight-replica:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11.16"
      - name: Install exact ProofGrid dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-proofgrid.txt
          python -m pip check
      - name: Run v3.0 fail-closed unit suite
        run: python -m unittest -v tests.test_model_inventory_v30
      - name: Build deterministic synthetic IFC preflight fixture
        run: |
          set -euo pipefail
          ROOT="/tmp/v30-${{ matrix.replica }}"
          mkdir -p "${ROOT}/out"
          python - <<'PY'
          import ifcopenshell, re
          from pathlib import Path
          root=Path('/tmp/v30-${{ matrix.replica }}')
          m=ifcopenshell.file(schema='IFC4')
          mass=m.create_entity('IfcSIUnit',UnitType='MASSUNIT',Prefix='KILO',Name='GRAM')
          units=m.create_entity('IfcUnitAssignment',Units=[mass])
          project=m.create_entity('IfcProject',GlobalId='0mS$wWKLjAuhSPZ5IG0yTz',Name='ProofGrid v3.0 preflight',UnitsInContext=units)
          building=m.create_entity('IfcBuilding',GlobalId='1mXL7DJx51bvggyIPU2Xj1',Name='Preflight Building')
          wall=m.create_entity('IfcWall',GlobalId='2mXL7DJx51bvggyIPU2Xj2',Name='Preflight Wall')
          opening=m.create_entity('IfcOpeningElement',GlobalId='3mXL7DJx51bvggyIPU2Xj3',Name='Preflight Opening')
          m.create_entity('IfcRelAggregates',GlobalId='0nXL7DJx51bvggyIPU2Xj4',RelatingObject=project,RelatedObjects=[building])
          m.create_entity('IfcRelContainedInSpatialStructure',GlobalId='1nXL7DJx51bvggyIPU2Xj5',RelatedElements=[wall,opening],RelatingStructure=building)
          material=m.create_entity('IfcMaterial',Name='RX-V30-PREFLIGHT-MATERIAL')
          m.create_entity('IfcRelAssociatesMaterial',GlobalId='2nXL7DJx51bvggyIPU2Xj6',RelatedObjects=[wall],RelatingMaterial=material)
          q=m.create_entity('IfcQuantityWeight',Name='Mass',WeightValue=125.0)
          qset=m.create_entity('IfcElementQuantity',GlobalId='3nXL7DJx51bvggyIPU2Xj7',Name='Qto_WallBaseQuantities',Quantities=[q])
          m.create_entity('IfcRelDefinesByProperties',GlobalId='0oXL7DJx51bvggyIPU2Xj8',RelatedObjects=[wall],RelatingPropertyDefinition=qset)
          path=root/'fixture.ifc'
          m.write(str(path))
          text=path.read_text(encoding='utf-8')
          text,count=re.subn(r"FILE_NAME\('[^']*','[^']*'","FILE_NAME('proofgrid-v30-preflight.ifc','2026-01-01T00:00:00'",text,count=1)
          assert count==1
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
          cat > "${ROOT}/authorization.json" <<'JSON'
          {
            "authorization_reference": "ci://proofgrid/v3.0/synthetic-preflight",
            "authorization_version": "3.0.0",
            "authorized_purpose": "ProofGrid v3.0 authoritative model inventory basis",
            "notes": ["Synthetic CI fixture; cannot close the production v3.0 gate."],
            "reconstructed": false,
            "schema_version": "1.0",
            "source_classification": "SYNTHETIC_TEST_FIXTURE",
            "synthetic": true,
            "user_authorized": false
          }
          JSON
      - name: Execute deterministic synthetic preflight twice
        run: |
          set -euo pipefail
          ROOT="/tmp/v30-${{ matrix.replica }}"
          for RUN in a b; do
            python -m reference.model_inventory_v30 \
              --ifc "${ROOT}/fixture.ifc" \
              --policy policies/inventory-policy-v30.json \
              --authorization "${ROOT}/authorization.json" \
              --output-dir "${ROOT}/out-${RUN}" \
              --preflight
          done
          diff -u "${ROOT}/out-a/model-admission-receipt.json" "${ROOT}/out-b/model-admission-receipt.json"
          diff -u "${ROOT}/out-a/model-inventory-basis.json" "${ROOT}/out-b/model-inventory-basis.json"
          diff -u "${ROOT}/out-a/model-inventory-basis-receipt.json" "${ROOT}/out-b/model-inventory-basis-receipt.json"
      - name: Assert bounded preflight semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          basis=json.loads(Path('/tmp/v30-${{ matrix.replica }}/out-a/model-inventory-basis.json').read_text())
          assert basis['verdict']=='V30_ENGINE_PREFLIGHT_VERIFIABLE'
          assert basis['production_gate_satisfied'] is False
          assert basis['inventory']['enumerated_count']==3
          assert basis['inventory']['classification_counts']=={'EVIDENCE_NOT_APPLICABLE':1,'EVIDENCE_REQUIRED':1,'OUT_OF_DECLARED_EVIDENCE_SCOPE':1}
          wall=next(x for x in basis['inventory']['entries'] if x['ifc_type']=='IfcWall')
          q=wall['declared_quantities'][0]
          assert q['quantity_lexical']=='125.'
          assert q['source_token_is_authority'] is True
          assert q['parser_numeric_value_is_authority'] is False
          assert q['parser_consistent_with_source'] is True
          assert basis['closure']['silent_drop_count']==0
          assert basis['claims']['model_inventory_basis_closed_for_policy'] is False
          assert basis['claims']['whole_building_lca_claimed'] is False
          assert basis['claims']['certified'] is False
          print('PREFLIGHT_IDENTITY_SET_SHA='+basis['inventory']['identity_set_sha256'])
          PY
      - name: Reject synthetic source as production closure
        run: |
          set -euo pipefail
          ROOT="/tmp/v30-${{ matrix.replica }}"
          set +e
          python -m reference.model_inventory_v30 --ifc "${ROOT}/fixture.ifc" --policy policies/inventory-policy-v30.json --authorization "${ROOT}/authorization.json" --output-dir "${ROOT}/negative-real"
          code=$?
          set -e
          test "$code" -ne 0
      - name: Reject policy byte drift
        run: |
          set -euo pipefail
          ROOT="/tmp/v30-${{ matrix.replica }}"
          cp policies/inventory-policy-v30.json "${ROOT}/drifted-policy.json"
          printf '\n' >> "${ROOT}/drifted-policy.json"
          set +e
          python -m reference.model_inventory_v30 --ifc "${ROOT}/fixture.ifc" --policy "${ROOT}/drifted-policy.json" --authorization "${ROOT}/authorization.json" --output-dir "${ROOT}/negative-policy" --preflight
          code=$?
          set -e
          test "$code" -ne 0
      - name: Reject duplicate non-empty GlobalId
        run: |
          set -euo pipefail
          ROOT="/tmp/v30-${{ matrix.replica }}"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v30-${{ matrix.replica }}/fixture.ifc')
          text=p.read_text(encoding='utf-8').replace('3mXL7DJx51bvggyIPU2Xj3','2mXL7DJx51bvggyIPU2Xj2')
          Path('/tmp/v30-${{ matrix.replica }}/duplicate-globalid.ifc').write_text(text,encoding='utf-8',newline='\n')
          PY
          set +e
          python -m reference.model_inventory_v30 --ifc "${ROOT}/duplicate-globalid.ifc" --policy policies/inventory-policy-v30.json --authorization "${ROOT}/authorization.json" --output-dir "${ROOT}/negative-globalid" --preflight
          code=$?
          set -e
          test "$code" -ne 0
      - name: Reject malformed IFC
        run: |
          ROOT="/tmp/v30-${{ matrix.replica }}"
          printf 'NOT AN IFC\n' > "${ROOT}/malformed.ifc"
          set +e
          python -m reference.model_inventory_v30 --ifc "${ROOT}/malformed.ifc" --policy policies/inventory-policy-v30.json --authorization "${ROOT}/authorization.json" --output-dir "${ROOT}/negative-malformed" --preflight
          code=$?
          set -e
          test "$code" -ne 0
      - name: Upload bounded preflight evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v30-engine-preflight-${{ matrix.replica }}
          path: |
            /tmp/v30-${{ matrix.replica }}/fixture.ifc
            /tmp/v30-${{ matrix.replica }}/out-a/model-admission-receipt.json
            /tmp/v30-${{ matrix.replica }}/out-a/model-inventory-basis.json
            /tmp/v30-${{ matrix.replica }}/out-a/model-inventory-basis-receipt.json
          if-no-files-found: error
          retention-days: 30

  compare-preflight:
    needs: preflight-replica
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: proofgrid-v30-engine-preflight-a
          path: /tmp/v30/a
      - uses: actions/download-artifact@v4.3.0
        with:
          name: proofgrid-v30-engine-preflight-b
          path: /tmp/v30/b
      - name: Require independent preflight byte identity
        run: |
          diff -u /tmp/v30/a/fixture.ifc /tmp/v30/b/fixture.ifc
          diff -u /tmp/v30/a/out-a/model-admission-receipt.json /tmp/v30/b/out-a/model-admission-receipt.json
          diff -u /tmp/v30/a/out-a/model-inventory-basis.json /tmp/v30/b/out-a/model-inventory-basis.json
          diff -u /tmp/v30/a/out-a/model-inventory-basis-receipt.json /tmp/v30/b/out-a/model-inventory-basis-receipt.json
          ! grep -q '"verdict": "MODEL_INVENTORY_BASIS_CLOSED_FOR_POLICY"' /tmp/v30/a/out-a/model-inventory-basis.json
          grep -q '"production_gate_satisfied": false' /tmp/v30/a/out-a/model-inventory-basis.json

  real-ifc-gate-status:
    runs-on: ubuntu-24.04
    steps:
      - name: Report authoritative source blocker
        run: |
          echo "V30_REAL_IFC_GATE=BLOCKED_NO_USER_AUTHORIZED_NATIVE_IFC"
          echo "Synthetic/reconstructed sources are prohibited from satisfying Issue #98."
