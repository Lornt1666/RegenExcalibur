name: ProofGrid v1.4.1 Product Identity Closure

on:
  pull_request:
    paths:
      - "reference/declaration_product_identity_closure.py"
      - "schemas/declaration-product-identity-closure.schema.json"
      - "tests/test_declaration_product_identity_closure.py"
      - "conformance/declaration-product-identity-v141/**"
      - ".github/workflows/proofgrid-v141-product-identity-closure.yml"
      - "requirements-proofgrid.txt"
      - "requirements-proofgrid-v07.txt"

permissions:
  contents: read
  actions: read

jobs:
  product-identity-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V14_ARTIFACT_ID: "9450293777"
      V14_ZIP_SHA256: "6bbc8efb8d762ce8171e94d27d5cffc42d34ab439bf5006cf6f79235cc7df4d2"
      V13_ARTIFACT_ID: "9449300824"
      V13_ZIP_SHA256: "503582a65087464c3caa3a671122d3081a51858b80d635f99e4c21dd107ce247"

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install exact ProofGrid dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proofgrid.txt
          python -m pip install -r requirements-proofgrid-v07.txt
          python -m pip check

      - name: Run v1.4.1 fail-closed unit suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_declaration_product_identity_closure

      - name: Download exact accepted v1.4 and v1.3 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/proofgrid-v141/parents/v14 /tmp/proofgrid-v141/parents/v13
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V14_ARTIFACT_ID}/zip" > /tmp/proofgrid-v141/v14.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V13_ARTIFACT_ID}/zip" > /tmp/proofgrid-v141/v13.zip
          echo "${V14_ZIP_SHA256}  /tmp/proofgrid-v141/v14.zip" | sha256sum -c -
          echo "${V13_ZIP_SHA256}  /tmp/proofgrid-v141/v13.zip" | sha256sum -c -
          unzip -q /tmp/proofgrid-v141/v14.zip -d /tmp/proofgrid-v141/parents/v14
          unzip -q /tmp/proofgrid-v141/v13.zip -d /tmp/proofgrid-v141/parents/v13

      - name: Bind exact accepted v1.2 product identity closure twice
        shell: bash
        run: |
          set -euo pipefail
          for R in a b; do
            python reference/declaration_product_identity_closure.py \
              --v14-bundle /tmp/proofgrid-v141/parents/v14/v12/a/declaration-evidence-bundle.json \
              --v14-receipt /tmp/proofgrid-v141/parents/v14/v12/a/declaration-evidence-bundle-receipt.json \
              --v13-basis /tmp/proofgrid-v141/parents/v13/v12/out-a/declared-reference-basis.json \
              --v13-basis-receipt /tmp/proofgrid-v141/parents/v13/v12/out-a/declared-reference-basis-receipt.json \
              --output-dir "/tmp/proofgrid-v141/v12/${R}"
          done
          diff -u /tmp/proofgrid-v141/v12/a/declaration-product-identity-closure.json /tmp/proofgrid-v141/v12/b/declaration-product-identity-closure.json
          diff -u /tmp/proofgrid-v141/v12/a/declaration-product-identity-closure-receipt.json /tmp/proofgrid-v141/v12/b/declaration-product-identity-closure-receipt.json

      - name: Bind exact accepted v1.3 product identity closure twice
        shell: bash
        run: |
          set -euo pipefail
          for R in a b; do
            python reference/declaration_product_identity_closure.py \
              --v14-bundle /tmp/proofgrid-v141/parents/v14/v13/a/declaration-evidence-bundle.json \
              --v14-receipt /tmp/proofgrid-v141/parents/v14/v13/a/declaration-evidence-bundle-receipt.json \
              --v13-basis /tmp/proofgrid-v141/parents/v13/v13/out-a/declared-reference-basis.json \
              --v13-basis-receipt /tmp/proofgrid-v141/parents/v13/v13/out-a/declared-reference-basis-receipt.json \
              --output-dir "/tmp/proofgrid-v141/v13/${R}"
          done
          diff -u /tmp/proofgrid-v141/v13/a/declaration-product-identity-closure.json /tmp/proofgrid-v141/v13/b/declaration-product-identity-closure.json
          diff -u /tmp/proofgrid-v141/v13/a/declaration-product-identity-closure-receipt.json /tmp/proofgrid-v141/v13/b/declaration-product-identity-closure-receipt.json

      - name: Verify exact identity closure and non-claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for version in ('v12','v13'):
            p=Path(f'/tmp/proofgrid-v141/{version}/a/declaration-product-identity-closure.json')
            r=json.loads(p.read_text())
            assert r['verdict']=='DECLARATION_PRODUCT_IDENTITY_CLOSURE_BOUND_VERIFIABLE'
            assert r['process_reference']['reference_exchange_internal_id']=='42'
            assert r['process_reference']['exchange_amount_decimal']=='1'
            assert r['process_reference']['product_flow_uuid']=='a7432abd-0881-4977-a817-f8aaf627fb91'
            assert r['process_reference']['product_flow_version']=='00.00.001'
            assert r['product_flow']['uuid']=='a7432abd-0881-4977-a817-f8aaf627fb91'
            assert r['product_flow']['version']=='00.00.001'
            assert any(x['value']=='wood panel' for x in r['product_flow']['names'])
            assert r['flow_property']['uuid']=='93a60a56-a3c8-11da-a746-0800200b9a66'
            assert r['flow_property']['version']=='03.00.000'
            assert r['flow_property']['reference_unit_group_uuid']=='ad38d542-3fe9-439d-9b95-2f5f7752acaf'
            assert r['reference_unit']['unit_group_uuid']=='ad38d542-3fe9-439d-9b95-2f5f7752acaf'
            assert r['reference_unit']['unit_group_version']=='25.00.000'
            assert r['reference_unit']['reference_unit_internal_id']=='0'
            assert r['reference_unit']['name']=='kg'
            assert r['reference_unit']['factor_decimal']=='1'
            assert r['declared_reference_basis']['quantity_decimal']=='1'
            assert r['declared_reference_basis']['unit']=='kg'
            assert r['environmental_evidence_binding']['environmental_result_unit']=='kg CO2 eqv.'
            assert r['environmental_evidence_binding']['product_reference_unit']=='kg'
            assert r['environmental_evidence_binding']['unit_interchange_permitted'] is False
            assert r['calculated'] is False
            assert r['building_quantity_multiplication_performed'] is False
            assert r['aggregation_performed'] is False
            assert r['unit_conversion_performed'] is False
            assert r['certified'] is False
          PY

      - name: Prove cross-version basis substitution fails closed
        shell: bash
        run: |
          set -euo pipefail
          if python reference/declaration_product_identity_closure.py \
            --v14-bundle /tmp/proofgrid-v141/parents/v14/v12/a/declaration-evidence-bundle.json \
            --v14-receipt /tmp/proofgrid-v141/parents/v14/v12/a/declaration-evidence-bundle-receipt.json \
            --v13-basis /tmp/proofgrid-v141/parents/v13/v13/out-a/declared-reference-basis.json \
            --v13-basis-receipt /tmp/proofgrid-v141/parents/v13/v13/out-a/declared-reference-basis-receipt.json \
            --output-dir /tmp/proofgrid-v141/negative; then
              echo "cross-version basis unexpectedly accepted" >&2
              exit 1
          else
              echo "CROSS_VERSION_BASIS_REJECTED=PASS"
          fi

      - name: Produce bounded v1.4.1 integration receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/proofgrid-v141')
          report={
            'verdict':'DECLARATION_PRODUCT_IDENTITY_CLOSURE_BOUND_VERIFIABLE',
            'accepted_parent_heads':{
              'v14':'9066ab770afab6d639708c12c669184a23afa575',
              'v13':'77931d81ae9857eb33b3cecaf8f9180f0c2b7e4a',
            },
            'accepted_parent_artifacts':{
              'v14':int('9450293777'),
              'v13':int('9449300824'),
            },
            'v12_record_file_sha256':hashlib.sha256((root/'v12/a/declaration-product-identity-closure.json').read_bytes()).hexdigest(),
            'v12_receipt_file_sha256':hashlib.sha256((root/'v12/a/declaration-product-identity-closure-receipt.json').read_bytes()).hexdigest(),
            'v13_record_file_sha256':hashlib.sha256((root/'v13/a/declaration-product-identity-closure.json').read_bytes()).hexdigest(),
            'v13_receipt_file_sha256':hashlib.sha256((root/'v13/a/declaration-product-identity-closure-receipt.json').read_bytes()).hexdigest(),
            'product_flow_uuid':'a7432abd-0881-4977-a817-f8aaf627fb91',
            'product_flow_version':'00.00.001',
            'reference_basis_quantity_decimal':'1',
            'reference_basis_unit':'kg',
            'real_accepted_parent_evidence_used':True,
            'repeat_within_run_byte_identical':True,
            'cross_version_basis_rejected':True,
            'ifc_material_mapping_performed':False,
            'building_quantity_multiplication_performed':False,
            'calculated':False,
            'environmental_values_transformed':False,
            'aggregation_performed':False,
            'unit_conversion_performed':False,
            'scientific_validation_performed':False,
            'professional_review_performed':False,
            'certified':False,
          }
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          report['receipt_sha256']=hashlib.sha256(canonical).hexdigest()
          (root/'v141-integration-receipt.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Retain product identity closure evidence only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v141-product-identity-closure
          path: |
            /tmp/proofgrid-v141/v12/a/declaration-product-identity-closure.json
            /tmp/proofgrid-v141/v12/a/declaration-product-identity-closure-receipt.json
            /tmp/proofgrid-v141/v13/a/declaration-product-identity-closure.json
            /tmp/proofgrid-v141/v13/a/declaration-product-identity-closure-receipt.json
            /tmp/proofgrid-v141/v141-integration-receipt.json
          if-no-files-found: error
          retention-days: 30
