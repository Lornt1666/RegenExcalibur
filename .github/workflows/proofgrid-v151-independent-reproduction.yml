name: ProofGrid v1.5.1 Independent Quantity Reproduction

on:
  pull_request:
    paths:
      - "reference/ifc_quantity_decimal.py"
      - "schemas/ifc-quantity-exact-decimal.schema.json"
      - "tests/test_ifc_quantity_decimal.py"
      - "conformance/ifc-quantity-decimal-v151/**"
      - ".github/workflows/proofgrid-v151-ifc-quantity-decimal.yml"
      - ".github/workflows/proofgrid-v151-independent-reproduction.yml"
      - "requirements-proofgrid.txt"
      - "requirements-proofgrid-v07.txt"

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    name: Independent reproduction ${{ matrix.attempt }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V15_ARTIFACT_ID: "9451317205"
      V15_ZIP_SHA256: "a09ae65ef0d221daadbd4cc1bbe7a21e252b92a29bd3bd21c433b13151741034"
      V15_IFC_SOURCE_SHA256: "23046f33df40fae4354fd085c2d72c6c9eaab3a45b2d46e77d8f9531041954c6"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install exact ProofGrid dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proofgrid.txt
          python -m pip install -r requirements-proofgrid-v07.txt
          python -m pip check

      - name: Download exact accepted v1.5 mapping artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/proofgrid-v151-independent/parent
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V15_ARTIFACT_ID}/zip" > /tmp/proofgrid-v151-independent/v15.zip
          echo "${V15_ZIP_SHA256}  /tmp/proofgrid-v151-independent/v15.zip" | sha256sum -c -
          unzip -q /tmp/proofgrid-v151-independent/v15.zip -d /tmp/proofgrid-v151-independent/parent

      - name: Rebuild exact deterministic accepted IFC4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proofgrid-v151-independent/ifc
          python - <<'PY'
          import ifcopenshell
          import re
          from pathlib import Path

          out=Path('/tmp/proofgrid-v151-independent/ifc/fixture.ifc')
          m=ifcopenshell.file(schema='IFC4')
          mass=m.create_entity('IfcSIUnit',UnitType='MASSUNIT',Prefix='KILO',Name='GRAM')
          units=m.create_entity('IfcUnitAssignment',Units=[mass])
          m.create_entity('IfcProject',GlobalId='0hS$wWKLjAuhSPZ5IG0yTw',Name='ProofGrid v1.5',UnitsInContext=units)
          wall=m.create_entity('IfcWall',GlobalId='1BXL7DJx51bvggyIPU2Xi5',Name='Mapped Wall')
          material=m.create_entity('IfcMaterial',Name='RX-MATERIAL-UNRELATED-TO-WOOD-PANEL')
          m.create_entity('IfcRelAssociatesMaterial',GlobalId='2BXL7DJx51bvggyIPU2Xi5',RelatedObjects=[wall],RelatingMaterial=material)
          q=m.create_entity('IfcQuantityWeight',Name='Mass',WeightValue=1000.0)
          qset=m.create_entity('IfcElementQuantity',GlobalId='3BXL7DJx51bvggyIPU2Xi5',Name='Qto_WallBaseQuantities',Quantities=[q])
          m.create_entity('IfcRelDefinesByProperties',GlobalId='0BXL7DJx51bvggyIPU2Xi5',RelatedObjects=[wall],RelatingPropertyDefinition=qset)
          m.write(str(out))
          text=out.read_text(encoding='utf-8')
          text,count=re.subn(r"(FILE_NAME\('[^']*',)'[^']*'",r"\1'2026-01-01T00:00:00'",text,count=1)
          if count != 1:
              raise SystemExit(f'expected one FILE_NAME timestamp, replaced {count}')
          out.write_text(text,encoding='utf-8',newline='\n')
          PY
          echo "${V15_IFC_SOURCE_SHA256}  /tmp/proofgrid-v151-independent/ifc/fixture.ifc" | sha256sum -c -

      - name: Extract exact source-authoritative Decimal evidence
        shell: bash
        run: |
          set -euo pipefail
          python reference/ifc_quantity_decimal.py \
            --ifc-source /tmp/proofgrid-v151-independent/ifc/fixture.ifc \
            --mapping-record /tmp/proofgrid-v151-independent/parent/out-a/ifc-declaration-product-mapping.json \
            --mapping-receipt /tmp/proofgrid-v151-independent/parent/out-a/ifc-declaration-product-mapping-receipt.json \
            --output-dir /tmp/proofgrid-v151-independent/out
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          p=Path('/tmp/proofgrid-v151-independent/out/ifc-declared-quantity-exact-decimal.json')
          r=json.loads(p.read_text())
          assert r['verdict']=='IFC_DECLARED_QUANTITY_EXACT_DECIMAL_VERIFIABLE'
          assert r['ifc_source']['sha256']=='23046f33df40fae4354fd085c2d72c6c9eaab3a45b2d46e77d8f9531041954c6'
          assert Decimal(r['quantity']['quantity_lexical'])==Decimal('1000')
          assert r['quantity']['quantity_decimal']=='1000'
          assert r['quantity']['unit_identity']=='kg'
          assert r['quantity']['source_token_is_authority'] is True
          assert r['quantity']['parser_numeric_value_is_authority'] is False
          assert r['calculation_performed'] is False
          assert r['certified'] is False
          PY

      - name: Retain independent canonical receipt set
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v151-independent-${{ matrix.attempt }}
          path: |
            /tmp/proofgrid-v151-independent/out/ifc-declared-quantity-exact-decimal.json
            /tmp/proofgrid-v151-independent/out/ifc-declared-quantity-exact-decimal-receipt.json
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare independent reproductions
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download independent artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: proofgrid-v151-independent-*
          path: /tmp/proofgrid-v151-compare

      - name: Require byte-identical independent outputs
        shell: bash
        run: |
          set -euo pipefail
          A=/tmp/proofgrid-v151-compare/proofgrid-v151-independent-a
          B=/tmp/proofgrid-v151-compare/proofgrid-v151-independent-b
          diff -u "$A/ifc-declared-quantity-exact-decimal.json" "$B/ifc-declared-quantity-exact-decimal.json"
          diff -u "$A/ifc-declared-quantity-exact-decimal-receipt.json" "$B/ifc-declared-quantity-exact-decimal-receipt.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('/tmp/proofgrid-v151-compare')
          a=base/'proofgrid-v151-independent-a'
          b=base/'proofgrid-v151-independent-b'
          files=['ifc-declared-quantity-exact-decimal.json','ifc-declared-quantity-exact-decimal-receipt.json']
          hashes={}
          for name in files:
              da=(a/name).read_bytes(); db=(b/name).read_bytes(); assert da==db
              hashes[name]=hashlib.sha256(da).hexdigest()
          record=json.loads((a/files[0]).read_text())
          report={
            'verdict':'IFC_DECLARED_QUANTITY_EXACT_DECIMAL_INDEPENDENTLY_REPRODUCED',
            'candidate_head':'${{ github.event.pull_request.head.sha }}',
            'independent_runner_count':2,
            'byte_identical':True,
            'ifc_source_sha256':record['ifc_source']['sha256'],
            'quantity_lexical':record['quantity']['quantity_lexical'],
            'quantity_decimal':record['quantity']['quantity_decimal'],
            'unit_identity':record['quantity']['unit_identity'],
            'canonical_file_hashes':hashes,
            'source_token_is_authority':True,
            'parser_numeric_value_is_authority':False,
            'calculation_performed':False,
            'environmental_calculation_performed':False,
            'building_quantity_multiplication_performed':False,
            'unit_conversion_performed':False,
            'certified':False,
          }
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          report['receipt_sha256']=hashlib.sha256(canonical).hexdigest()
          out=base/'independent-reproduction-receipt.json'
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Retain independent comparison receipt
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v151-independent-comparison
          path: /tmp/proofgrid-v151-compare/independent-reproduction-receipt.json
          if-no-files-found: error
          retention-days: 30
