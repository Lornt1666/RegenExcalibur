name: ProofGrid v1.3 Declaration Basis Research

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v13-declaration-basis-research.yml'
      - 'conformance/declaration-basis-v13/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declaration-basis-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11.16'

      - name: Checkout pinned InData v1.2 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData v1.3 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: 7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa
          path: .proofgrid-upstream/indata-v13
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData master data
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Master-Data
          ref: 32117b6a70d6c486344247a429449755a2c7eab4
          path: .proofgrid-upstream/indata-master
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable upstream commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .proofgrid-upstream/indata-v12 rev-parse HEAD)" = 'b7233bd2dd5435a6b5973505ffa212cd03d23468'
          test "$(git -C .proofgrid-upstream/indata-v13 rev-parse HEAD)" = '7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa'
          test "$(git -C .proofgrid-upstream/indata-master rev-parse HEAD)" = '32117b6a70d6c486344247a429449755a2c7eab4'

      - name: Resolve process → flow → flow-property → unit-group graph by UUID
        shell: bash
        run: |
          set -euo pipefail
          python conformance/declaration-basis-v13/research_probe.py \
            --v12-root .proofgrid-upstream/indata-v12 \
            --v13-root .proofgrid-upstream/indata-v13 \
            --master-root .proofgrid-upstream/indata-master \
            --output /tmp/proofgrid-v13-declaration-basis-research.json

      - name: Require bounded research-only semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/proofgrid-v13-declaration-basis-research.json'))
          assert d['verdict']=='DECLARATION_BASIS_STRUCTURE_RESEARCH_VERIFIABLE'
          for version in ('v12','v13'):
              row=d[version]
              assert row['process_reference']['quantitative_reference']['reference_flow_internal_ids']
              assert row['process_reference']['reference_exchange']['reference_to_flow_dataset']['uuid']
              assert row['flow_reference']['reference_flow_property_relation']['reference_to_flow_property_dataset']['uuid']
              assert row['flow_property_reference']['reference_to_unit_group']['uuid']
              assert row['unit_group_reference']['reference_unit']['internal_id']
              assert row['unit_group_reference']['reference_unit']['name']
              assert row['unit_group_reference']['reference_unit']['conversion_factor']['decimal']
              assert row['declaration_basis_selected'] is False
              assert row['building_quantity_multiplication_permitted'] is False
              assert row['unit_conversion_performed'] is False
          assert d['declaration_basis_selected'] is False
          assert d['basis_extractor_accepted'] is False
          assert d['building_quantity_multiplication_permitted'] is False
          assert d['unit_conversion_performed'] is False
          assert d['scientific_validation_performed'] is False
          assert d['professional_review_performed'] is False
          assert d['certified'] is False
          print('DECLARATION_BASIS_STRUCTURE_RESEARCH=PASS')
          print('receipt_sha256=',d['receipt_sha256'])
          PY

      - name: Retain research receipt
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v13-declaration-basis-research
          path: /tmp/proofgrid-v13-declaration-basis-research.json
          if-no-files-found: warn
          retention-days: 30
