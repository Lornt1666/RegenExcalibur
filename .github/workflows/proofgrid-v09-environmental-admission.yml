name: ProofGrid v0.9 Environmental Admission

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v09-environmental-admission.yml'
      - 'reference/environmental_admission.py'
      - 'reference/source_import.py'
      - 'reference/ilcd_epd_v13_conformance.py'
      - 'conformance/oekobaudat-v12/**'
      - 'conformance/ilcd-epd-v13/**'
      - 'schemas/source-import-manifest.schema.json'
      - 'tests/test_environmental_admission.py'
      - 'requirements-proofgrid.txt'
      - 'requirements-proofgrid-v07.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environmental-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11.16'

      - name: Setup Java 17
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact ProofGrid dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proofgrid.txt
          python -m pip install -r requirements-proofgrid-v07.txt
          python -m pip check

      - name: Run v0.9 fail-closed unit suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_environmental_admission

      - name: Checkout pinned InData v1.2 samples
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData v1.3 format
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: 7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa
          path: .proofgrid-upstream/indata-v13
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData master data
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Master-Data
          ref: 32117b6a70d6c486344247a429449755a2c7eab4
          path: .proofgrid-upstream/indata-master
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact v1.2 official profile stack and compile probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v09
          mkdir -p "$OUT/classes"
          cat > "$OUT/v12-pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>proofgrid.v09</groupId>
            <artifactId>environmental-admission-v12</artifactId>
            <version>0.9.0</version>
            <dependencies>
              <dependency>
                <groupId>com.okworx.ilcd.validation</groupId>
                <artifactId>ilcd-validation</artifactId>
                <version>2.12.2</version>
              </dependency>
              <dependency>
                <groupId>com.okworx.ilcd.validation.profiles</groupId>
                <artifactId>EPD-1.2-OEKOBAUDAT</artifactId>
                <version>3.8.0</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn -B -ntp -f "$OUT/v12-pom.xml" dependency:go-offline
          mvn -B -ntp -f "$OUT/v12-pom.xml" dependency:build-classpath \
            -Dmdep.outputFile="$OUT/v12-classpath.txt" -Dmdep.pathSeparator=:

          LIB="$HOME/.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2/ilcd-validation-2.12.2.jar"
          PROFILE="$HOME/.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0/EPD-1.2-OEKOBAUDAT-3.8.0.jar"
          test "$(sha256sum "$LIB" | awk '{print $1}')" = '55427919601b5deceee99b34fbbbaf8f00cbcf0aca1fdb1eb493c31f473e077b'
          test "$(sha256sum "$PROFILE" | awk '{print $1}')" = '96ee05b9cf5172a344df3ea844aa8d94060eae4e4e8188f72e46441a3d61921e'
          test "$(unzip -p "$PROFILE" includes/EPD-1.2-Generic.jar | sha256sum | awk '{print $1}')" = '31402bb2746ddb9d2ab4ce40dd5d3e848ab701d1f4da00f2da004f15c7e1cc25'
          test "$(unzip -p "$PROFILE" includes/EPD-1.2-EN15804.jar | sha256sum | awk '{print $1}')" = 'a05ac55df8f567985da8c95e30ff6579761d336e0f23087aa73fefb4d9a2b147'
          printf '%s\n' "$PROFILE" > "$OUT/v12-profile-path.txt"
          javac -encoding UTF-8 -cp "$(cat "$OUT/v12-classpath.txt")" -d "$OUT/classes" \
            conformance/oekobaudat-v12/OekobaudatProfileProbe.java

      - name: Stage deterministic v1.2 authority-safe source package
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v09
          PROFILE=$(cat "$OUT/v12-profile-path.txt")
          python conformance/oekobaudat-v12/build_authority_safe_fixture.py \
            --sample-root .proofgrid-upstream/indata-v12/sample_data \
            --master-root .proofgrid-upstream/indata-master \
            --profile-jar "$PROFILE" \
            --output-root "$OUT/v12-source-dir"

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path('/tmp/proofgrid-v09')
          src=root/'v12-source-dir'
          pkg=root/'v12-package'; pkg.mkdir(parents=True,exist_ok=True)
          zip_path=pkg/'source.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_STORED) as zf:
              for path in sorted((src/'ILCD').rglob('*')):
                  if not path.is_file(): continue
                  rel=path.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel)
                  info.date_time=(1980,1,1,0,0,0); info.external_attr=0o100644<<16
                  zf.writestr(info,path.read_bytes())
          terms=pkg/'terms.txt'
          terms.write_text('ProofGrid v0.9 TEST_ONLY authority for the internally generated authority-safe v1.2 fixture.\n',encoding='utf-8')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'schema_version':'1.0','import_id':'RX-V09-V12','manifest_version':'1.0',
            'provider':{'name':'RegenExcalibur synthetic authority-safe fixture','program':'ProofGrid v0.9','source_locator':'local:generated-v08-authority-safe'},
            'acquisition':{'method':'TEST_FIXTURE','synthetic':True,'intended_use':'INTERNAL_TEST'},
            'authorization':{
              'status':'TEST_ONLY','commercial_use':'PROHIBITED','storage':'ALLOWED','transformation':'ALLOWED','redistribution':'PROHIBITED',
              'terms_reference':'ProofGrid v0.9 synthetic test authority','terms_snapshot':{'path':'terms.txt','sha256':sha(terms)},
              'approval_reference':None,'valid_until':None},
            'source':{'path':'source.zip','sha256':sha(zip_path),'media_type':'application/zip','declared_format':{'name':'ILCD+EPD','version':'1.2'}},
            'parser':{'name':'proofgrid-ilcd-epd-admission-router','version':'0.9.0','profile':'auto-v1.2-v1.3'},
            'normalized_record_id':'RX-V09-V12-ADMISSION'
          }
          (pkg/'import-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('v12_source_zip_sha256=',sha(zip_path))
          PY

          python reference/environmental_admission.py preflight "$OUT/v12-package" \
            --as-of 2026-08-20 --output "$OUT/v12-preflight.json"
          python - <<'PY'
          import json
          build=json.load(open('/tmp/proofgrid-v09/v12-source-dir/fixture-build-receipt.json'))
          pre=json.load(open('/tmp/proofgrid-v09/v12-preflight.json'))
          assert build['receipt_sha256']=='a462a3a8ab9a215a3ae73e540b14374a84bf8cb332f8fef8c3ff081982fec56c'
          assert pre['source']['package_manifest_sha256']=='0bf4bf1fc0880cc693ead60f775d9e631ff13b8e70e5be02482f3615ae2551aa'
          assert pre['routing']['route']=='OEKOBAUDAT_V12_PROFILE_3_8_0'
          assert pre['normalization_permitted'] is False
          print('V12_PREFLIGHT=PASS')
          PY

      - name: Execute exact v1.2 profile only after admission preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v09
          CP=$(cat "$OUT/v12-classpath.txt"):$OUT/classes
          PROFILE=$(cat "$OUT/v12-profile-path.txt")
          java -Djava.net.useSystemProxies=false -cp "$CP" \
            proofgrid.v08.OekobaudatProfileProbe \
            "$PROFILE" "$OUT/v12-source-dir" "$OUT/v12-profile-result.json" v09-v12
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/proofgrid-v09')
          pre=json.loads((root/'v12-preflight.json').read_text())
          result=json.loads((root/'v12-profile-result.json').read_text())
          build=json.loads((root/'v12-source-dir/fixture-build-receipt.json').read_text())
          assert result['profile_name']=='EPD 1.2 ÖKOBAUDAT'
          assert result['profile_version']=='3.8.0'
          assert result['error_count']==0 and result['is_positive'] is True
          body={
            'claim_token':'OEKOBAUDAT_V12_PROFILE_380_SYNTHETIC_AUTHORITY_SAFE_COMPATIBLE',
            'compatibility_claim':True,
            'compatibility_scope':'ProofGrid v0.9 internally generated authority-safe synthetic v1.2 admission control.',
            'certified':False,'authority_inference_allowed':False,'real_provider_epd_tested':False,
            'fixture_build_receipt_sha256':build['receipt_sha256'],
            'package_manifest_sha256':pre['source']['package_manifest_sha256'],
            'official_profile':{'coordinate':'com.okworx.ilcd.validation.profiles:EPD-1.2-OEKOBAUDAT:3.8.0','jar_sha256':'96ee05b9cf5172a344df3ea844aa8d94060eae4e4e8188f72e46441a3d61921e'},
            'positive_control':{'error_count':result['error_count'],'warning_count':result['warning_count'],'is_positive':result['is_positive']},
            'limitations':['Synthetic internal admission control; not certification, provider authorization, scientific validation, or programme-operator approval.']
          }
          raw=json.dumps(body,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          body['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          (root/'v12-conformance.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY
          python reference/environmental_admission.py finalize \
            --preflight "$OUT/v12-preflight.json" --conformance "$OUT/v12-conformance.json" \
            --output "$OUT/v12-admission.json"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/proofgrid-v09/v12-admission.json'))
          assert d['verdict']=='ENVIRONMENTAL_DECLARATION_ADMISSION_PIPELINE_VERIFIABLE'
          assert d['admitted'] is True and d['normalization_permitted'] is True and d['certified'] is False
          assert d['routing']['route']=='OEKOBAUDAT_V12_PROFILE_3_8_0'
          assert d['conformance']['profile_validation_performed'] is True
          print('V12_ADMISSION=PASS')
          PY

      - name: Stage deterministic v1.3 synthetic source before admission
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v09
          mkdir -p "$OUT/v13-package"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from reference import ilcd_epd_v13_conformance as v13
          root=Path('/tmp/proofgrid-v09')
          cfg=json.loads(Path('conformance/ilcd-epd-v13/upstream.json').read_text())
          official=Path('.proofgrid-upstream/indata-v13')/cfg['format']['official_example']['path']
          source=root/'v13-package/source.xml'
          v13.build_synthetic_fixture(official,source,cfg['synthetic_fixture'])
          terms=root/'v13-package/terms.txt'
          terms.write_text('ProofGrid v0.9 TEST_ONLY authority for the internally generated v1.3 synthetic derivative.\n',encoding='utf-8')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'schema_version':'1.0','import_id':'RX-V09-V13','manifest_version':'1.0',
            'provider':{'name':'RegenExcalibur synthetic InData-derived fixture','program':'ProofGrid v0.9','source_locator':'local:generated-v07-synthetic'},
            'acquisition':{'method':'TEST_FIXTURE','synthetic':True,'intended_use':'INTERNAL_TEST'},
            'authorization':{
              'status':'TEST_ONLY','commercial_use':'PROHIBITED','storage':'ALLOWED','transformation':'ALLOWED','redistribution':'PROHIBITED',
              'terms_reference':'ProofGrid v0.9 synthetic test authority','terms_snapshot':{'path':'terms.txt','sha256':sha(terms)},
              'approval_reference':None,'valid_until':None},
            'source':{'path':'source.xml','sha256':sha(source),'media_type':'application/xml','declared_format':{'name':'ILCD+EPD','version':'1.3'}},
            'parser':{'name':'proofgrid-ilcd-epd-admission-router','version':'0.9.0','profile':'auto-v1.2-v1.3'},
            'normalized_record_id':'RX-V09-V13-ADMISSION'
          }
          (root/'v13-package/import-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('v13_source_sha256=',sha(source))
          PY
          python reference/environmental_admission.py preflight "$OUT/v13-package" \
            --as-of 2026-08-20 --output "$OUT/v13-preflight.json"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/proofgrid-v09/v13-preflight.json'))
          assert d['routing']['route']=='INDATA_V13_XSD_MASTERDATA_ONLY'
          assert d['routing']['profile_validation_applicable'] is False
          assert d['normalization_permitted'] is False
          print('V13_PREFLIGHT=PASS')
          PY

      - name: Execute authoritative v1.3 XSD/master-data gate only after preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v09
          python reference/ilcd_epd_v13_conformance.py \
            --format-root .proofgrid-upstream/indata-v13 \
            --master-root .proofgrid-upstream/indata-master \
            --output-dir "$OUT/v13-conformance-output"
          cp "$OUT/v13-conformance-output/ilcd-epd-v13-conformance-receipt.json" "$OUT/v13-conformance.json"
          python - <<'PY'
          import hashlib,json
          pre=json.load(open('/tmp/proofgrid-v09/v13-preflight.json'))
          conf=json.load(open('/tmp/proofgrid-v09/v13-conformance.json'))
          assert conf['synthetic_fixture']['sha256']==pre['source']['source_sha256']
          assert conf['format_conformance']['profile_validation_performed'] is False
          print('V13_SOURCE_BINDING=PASS')
          PY
          python reference/environmental_admission.py finalize \
            --preflight "$OUT/v13-preflight.json" --conformance "$OUT/v13-conformance.json" \
            --output "$OUT/v13-admission.json"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/proofgrid-v09/v13-admission.json'))
          assert d['verdict']=='ENVIRONMENTAL_DECLARATION_ADMISSION_PIPELINE_VERIFIABLE'
          assert d['admitted'] is True and d['normalization_permitted'] is True and d['certified'] is False
          assert d['routing']['route']=='INDATA_V13_XSD_MASTERDATA_ONLY'
          assert d['conformance']['profile_validation_performed'] is False
          print('V13_ADMISSION=PASS')
          PY

      - name: Prove route-swap and approval negatives fail closed
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v09
          if python reference/environmental_admission.py finalize \
            --preflight "$OUT/v13-preflight.json" --conformance "$OUT/v12-conformance.json" \
            --output "$OUT/should-not-exist-route-swap.json"; then
            echo 'v1.3 preflight incorrectly accepted v1.2 profile receipt' >&2; exit 1
          fi

          cp -a "$OUT/v13-package" "$OUT/v13-approval-negative"
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/proofgrid-v09/v13-approval-negative/import-manifest.json')
          d=json.loads(p.read_text())
          d['authorization']['status']='EXPLICITLY_AUTHORIZED'
          d['authorization']['approval_reference']=None
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          if python reference/environmental_admission.py preflight "$OUT/v13-approval-negative" \
            --as-of 2026-08-20 --output "$OUT/should-not-exist-approval.json"; then
            echo 'missing explicit approval reference was accepted' >&2; exit 1
          fi
          echo 'V09_NEGATIVE_ROUTING_AND_APPROVAL=PASS'

      - name: Produce v0.9 integration receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/proofgrid-v09')
          v12=json.loads((root/'v12-admission.json').read_text())
          v13=json.loads((root/'v13-admission.json').read_text())
          receipt={
            'gate':'ProofGrid v0.9 environmental declaration admission integration',
            'verdict':'ENVIRONMENTAL_DECLARATION_ADMISSION_PIPELINE_VERIFIABLE',
            'certified':False,
            'engine_version':'0.9.0',
            'v12':{
              'admission_receipt_sha256':v12['receipt_sha256'],
              'source_sha256':v12['source']['sha256'],
              'package_manifest_sha256':v12['source']['package_manifest_sha256'],
              'route':v12['routing']['route'],
              'profile_validation_performed':v12['conformance']['profile_validation_performed'],
              'normalization_permitted':v12['normalization_permitted']},
            'v13':{
              'admission_receipt_sha256':v13['receipt_sha256'],
              'source_sha256':v13['source']['sha256'],
              'route':v13['routing']['route'],
              'profile_validation_performed':v13['conformance']['profile_validation_performed'],
              'normalization_permitted':v13['normalization_permitted']},
            'negative_controls':{
              'route_swap':'REJECTED','explicit_authorization_without_approval_reference':'REJECTED',
              'unit_suite':'tests.test_environmental_admission'},
            'evidence_separation':[
              'AUTHORIZED','FORMAT_CONFORMANT','PROFILE_COMPATIBLE','SCIENTIFICALLY_VALID','PROFESSIONALLY_REVIEWED','CERTIFIED'],
            'limitations':[
              'Both positive inputs are deterministic synthetic test fixtures; no real provider EPD is admitted.',
              'Admission grants normalization permission only for the exact source identity after authority and applicable conformance gates; it is not certification or scientific/professional/regulatory approval.'
            ]
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          receipt['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          (root/'v09-integration-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Retain receipts only — no source packages
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v09-environmental-admission
          path: |
            /tmp/proofgrid-v09/v09-integration-receipt.json
            /tmp/proofgrid-v09/v12-preflight.json
            /tmp/proofgrid-v09/v12-conformance.json
            /tmp/proofgrid-v09/v12-admission.json
            /tmp/proofgrid-v09/v12-profile-result.json
            /tmp/proofgrid-v09/v13-preflight.json
            /tmp/proofgrid-v09/v13-conformance.json
            /tmp/proofgrid-v09/v13-admission.json
          if-no-files-found: error
          retention-days: 30
