name: ProofGrid v1.2.1 Hardened RXEP Exact Decimal Binding

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v121-hardened-rxep-binding.yml'
      - 'reference/rxep_declared_indicator_binding_v121.py'
      - 'reference/rxep_declared_indicator_binding.py'
      - 'tests/test_rxep_declared_indicator_binding_v121.py'
      - 'schemas/rxep-v02-declared-indicator-bundle.schema.json'
      - 'specs/rxep/v0.2/evidence-envelope.schema.json'
      - 'reference/declared_environmental_indicators_v111.py'
      - 'tests/test_declared_environmental_indicators_v111.py'
      - 'requirements-proofgrid.txt'
      - 'requirements-proofgrid-v07.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-rxep-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11.16'

      - name: Install exact ProofGrid dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proofgrid.txt
          python -m pip install -r requirements-proofgrid-v07.txt
          python -m pip check

      - name: Run hardened RXEP and parent suites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_rxep_declared_indicator_binding_v121 \
            tests.test_declared_environmental_indicators_v111 \
            tests.test_environmental_source_identity

      - name: Checkout pinned InData v1.2 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData v1.3 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: 7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa
          path: .proofgrid-upstream/indata-v13
          fetch-depth: 1
          persist-credentials: false

      - name: Build hardened v1.1.1 nine-row parents from pinned examples
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, zipfile
          from tests.test_declared_environmental_indicators_v111 import hardened_chain
          from reference import declared_environmental_indicators_v111 as declared

          def write_zip_entry(zf,name,data):
              info=zipfile.ZipInfo(name)
              info.date_time=(1980,1,1,0,0,0)
              info.compress_type=zipfile.ZIP_STORED
              info.external_attr=0o100644 << 16
              zf.writestr(info,data)

          root=Path('/tmp/proofgrid-v121'); root.mkdir(parents=True,exist_ok=True)
          for label,version in [('v12','1.2'),('v13','1.3')]:
              d=root/label; d.mkdir()
              if version=='1.2':
                  raw=Path('.proofgrid-upstream/indata-v12/sample_data/processes/57a4ae65-d305-421e-b21f-a3f0c35b8abe.xml').read_bytes()
                  source=d/'source.zip'
                  with zipfile.ZipFile(source,'w',compression=zipfile.ZIP_STORED) as zf:
                      write_zip_entry(zf,'ILCD/processes/57a4ae65-d305-421e-b21f-a3f0c35b8abe.xml',raw)
                  media='application/zip'
              else:
                  source=d/'source.xml'
                  source.write_bytes(Path('.proofgrid-upstream/indata-v13/sample_data/processes/EPDv1.3_example_57a4ae65-d305-421e-b21f-a3f0c35b8abe.xml').read_bytes())
                  media='application/xml'
              _,_,_,canonical=hardened_chain(source,media,version)
              record=declared.extract_record(source,canonical)
              record_bytes=(json.dumps(record,indent=2,sort_keys=True,ensure_ascii=False)+'\n').encode()
              receipt=declared.base.build_receipt(record,record_bytes)
              assert receipt['engine']['version']=='1.1.1'
              assert len(record['rows'])==9
              (d/'declared-environmental-indicators.json').write_bytes(record_bytes)
              (d/'extraction-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
              (d/'canonical-source-identity.json').write_text(json.dumps(canonical,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print('HARDENED_V111_NINE_ROW_PARENTS=PASS')
          PY

      - name: Bind v1.2 parent into frozen RXEP v0.2 twice
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/proofgrid-v121/v12
          for N in a b; do
            python reference/rxep_declared_indicator_binding_v121.py \
              --extraction-record "$ROOT/declared-environmental-indicators.json" \
              --extraction-receipt "$ROOT/extraction-receipt.json" \
              --output-dir "$ROOT/bound-$N"
          done
          for F in rxep-v02-declared-indicator-bundle.json rxep-v02-binding-receipt.json v121-hardening-receipt.json; do
            diff -u "$ROOT/bound-a/$F" "$ROOT/bound-b/$F"
          done

      - name: Bind v1.3 parent into frozen RXEP v0.2 twice
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/proofgrid-v121/v13
          for N in a b; do
            python reference/rxep_declared_indicator_binding_v121.py \
              --extraction-record "$ROOT/declared-environmental-indicators.json" \
              --extraction-receipt "$ROOT/extraction-receipt.json" \
              --output-dir "$ROOT/bound-$N"
          done
          for F in rxep-v02-declared-indicator-bundle.json rxep-v02-binding-receipt.json v121-hardening-receipt.json; do
            diff -u "$ROOT/bound-a/$F" "$ROOT/bound-b/$F"
          done

      - name: Verify 9 CLAIMED exact-decimal envelopes with frozen protocol plus hardened parent receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          for label in ('v12','v13'):
              root=f'/tmp/proofgrid-v121/{label}/bound-a'
              bundle=json.load(open(root+'/rxep-v02-declared-indicator-bundle.json'))
              protocol=json.load(open(root+'/rxep-v02-binding-receipt.json'))
              hardening=json.load(open(root+'/v121-hardening-receipt.json'))
              assert bundle['verdict']=='RXEP_DECLARED_INDICATOR_EVIDENCE_BOUND_VERIFIABLE'
              assert bundle['protocol_version']=='0.2'
              assert bundle['envelope_count']==9
              assert bundle['review_state']=='CLAIMED'
              assert bundle['signed'] is False and bundle['certified'] is False
              assert protocol['engine']['version']=='1.2.0'
              assert hardening['verdict']=='RXEP_DECLARED_INDICATOR_HARDENED_PARENT_BOUND_VERIFIABLE'
              assert hardening['engine']['version']=='1.2.1'
              assert hardening['parent_extraction']['engine_version']=='1.1.1'
              assert hardening['rxep_v02']['binder_version']=='1.2.0'
              assert hardening['rxep_v02']['core_extraction_methodology_version']=='1.1.0'
              assert hardening['rxep_v02']['binding_receipt_sha256']==protocol['receipt_sha256']
              assert hardening['evidence_dimensions']['rxep_v02_protocol_preserved'] is True
              assert hardening['review_state']=='CLAIMED' and hardening['signed'] is False and hardening['certified'] is False
              for env in bundle['envelopes']:
                  assert env['review']=={'state':'CLAIMED','reviewer':None}
                  assert env['integrity']['signature'] is None
                  assert env['methodology']['version']=='1.1.0'
                  assert env['software']['version']=='1.2.0'
                  assert env['methodology']['operation']=='EXTRACTION_ONLY'
                  assert env['methodology']['formula'] is None
                  assert env['methodology']['aggregation_performed'] is False
                  m=env['measurement']
                  assert isinstance(m['value_lexical'],str) and isinstance(m['value_decimal'],str)
                  assert m['value_origin']=='DECLARED_IN_SOURCE'
                  assert m['calculated'] is False
                  assert m['unit_conversion_performed'] is False
                  assert env['evidence_dimensions']['scientific_validity']=='NOT_EVALUATED'
                  assert env['evidence_dimensions']['professional_review']=='NOT_EVALUATED'
                  assert env['evidence_dimensions']['certification']=='NOT_EVALUATED'
          print('V121_HARDENED_PARENT_FROZEN_RXEP_V02=PASS')
          PY

      - name: Prove historical v1.1.0 parent receipt is rejected
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/proofgrid-v121/v12
          cp "$ROOT/extraction-receipt.json" "$ROOT/stale-receipt.json"
          python - <<'PY'
          import json
          from reference import rxep_declared_indicator_binding_v121 as b
          p='/tmp/proofgrid-v121/v12/stale-receipt.json'
          d=json.load(open(p)); d['engine']['version']='1.1.0'; d.pop('receipt_sha256',None)
          d['receipt_sha256']=b.sha256_bytes(b.canonical_json_bytes(d))
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          if python reference/rxep_declared_indicator_binding_v121.py \
            --extraction-record "$ROOT/declared-environmental-indicators.json" \
            --extraction-receipt "$ROOT/stale-receipt.json" \
            --output-dir "$ROOT/should-not-exist"; then
            echo 'historical 1.1.0 extraction receipt unexpectedly accepted' >&2
            exit 1
          fi
          echo HISTORICAL_V110_PARENT_REJECTED=PASS

      - name: Prove automatic review-state elevation is rejected
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/proofgrid-v121/v12
          if python reference/rxep_declared_indicator_binding_v121.py \
            --extraction-record "$ROOT/declared-environmental-indicators.json" \
            --extraction-receipt "$ROOT/extraction-receipt.json" \
            --output-dir "$ROOT/should-not-review" \
            --review-state REVIEWED; then
            echo 'automatic REVIEWED elevation unexpectedly accepted' >&2
            exit 1
          fi
          echo REVIEW_ELEVATION_REJECTED=PASS

      - name: Produce v1.2.1 integration receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/proofgrid-v121')
          def load(p): return json.loads(Path(p).read_text())
          v12b=load(root/'v12/bound-a/rxep-v02-declared-indicator-bundle.json')
          v12r=load(root/'v12/bound-a/rxep-v02-binding-receipt.json')
          v12h=load(root/'v12/bound-a/v121-hardening-receipt.json')
          v13b=load(root/'v13/bound-a/rxep-v02-declared-indicator-bundle.json')
          v13r=load(root/'v13/bound-a/rxep-v02-binding-receipt.json')
          v13h=load(root/'v13/bound-a/v121-hardening-receipt.json')
          report={
            'verdict':'RXEP_DECLARED_INDICATOR_HARDENED_PARENT_BOUND_VERIFIABLE',
            'hardening_engine_version':'1.2.1',
            'rxep_protocol_version':'0.2',
            'rxep_binder_version':'1.2.0',
            'core_extraction_methodology_version':'1.1.0',
            'hardened_parent_extraction_version':'1.1.1',
            'rxep_v02_protocol_preserved':True,
            'parent_v111_head':'61e6f86c3c633ab8191539292f36cbb1706689f1',
            'historical_binder_evidence_head':'9fbfa4f65863abcdc7be6becc4c5d0520f6d8d60',
            'historical_v110_parent_rejected':True,
            'automatic_review_elevation_rejected':True,
            'deterministic_repeat_within_run':True,
            'review_state':'CLAIMED',
            'signed':False,
            'calculated':False,
            'unit_conversion_performed':False,
            'aggregation_performed':False,
            'scientific_validation_performed':False,
            'professional_review_performed':False,
            'certified':False,
            'v12':{
              'bundle_content_sha256':v12b['integrity']['content_sha256'],
              'protocol_binding_receipt_sha256':v12r['receipt_sha256'],
              'hardening_receipt_sha256':v12h['receipt_sha256'],
              'envelope_count':v12b['envelope_count']},
            'v13':{
              'bundle_content_sha256':v13b['integrity']['content_sha256'],
              'protocol_binding_receipt_sha256':v13r['receipt_sha256'],
              'hardening_receipt_sha256':v13h['receipt_sha256'],
              'envelope_count':v13b['envelope_count']},
            'limitations':[
              'RXEP v0.2 remains byte-compatible with its frozen schema: methodology 1.1.0 is the unchanged parser algorithm and binder 1.2.0 is the frozen protocol binder.',
              'v1.2.1 separately proves that the frozen RXEP v0.2 evidence was bound from a hardened v1.1.1 extraction receipt.',
              'All envelopes remain CLAIMED, unsigned, non-calculated, and non-certified; no scientific/professional/regulatory claim is established.'
            ]}
          raw=json.dumps(report,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          report['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          (root/'v121-integration-receipt.json').write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False))
          PY

      - name: Retain hardened RXEP evidence only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v121-hardened-rxep-binding
          path: |
            /tmp/proofgrid-v121/v121-integration-receipt.json
            /tmp/proofgrid-v121/v12/bound-a/rxep-v02-declared-indicator-bundle.json
            /tmp/proofgrid-v121/v12/bound-a/rxep-v02-binding-receipt.json
            /tmp/proofgrid-v121/v12/bound-a/v121-hardening-receipt.json
            /tmp/proofgrid-v121/v13/bound-a/rxep-v02-declared-indicator-bundle.json
            /tmp/proofgrid-v121/v13/bound-a/rxep-v02-binding-receipt.json
            /tmp/proofgrid-v121/v13/bound-a/v121-hardening-receipt.json
          if-no-files-found: error
          retention-days: 30
