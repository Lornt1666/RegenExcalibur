name: ProofGrid v1.1 Indicator Structure Research

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v11-indicator-structure-research.yml'
      - 'conformance/indicator-extraction-v11/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indicator-structure-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11.16'

      - name: Checkout pinned InData v1.2 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData v1.3 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: 7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa
          path: .proofgrid-upstream/indata-v13
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze authoritative catalogue identities
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v11-research
          mkdir -p "$OUT"
          test "$(git -C .proofgrid-upstream/indata-v12 rev-parse HEAD)" = 'b7233bd2dd5435a6b5973505ffa212cd03d23468'
          test "$(git -C .proofgrid-upstream/indata-v13 rev-parse HEAD)" = '7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa'
          CATALOG=.proofgrid-upstream/indata-v13/doc/identifiers/EN15804+A2_EF3.0_indicators.csv
          test -f "$CATALOG"
          sha256sum "$CATALOG" | tee "$OUT/ef30-catalog.sha256"
          git -C .proofgrid-upstream/indata-v13 hash-object doc/identifiers/EN15804+A2_EF3.0_indicators.csv | tee "$OUT/ef30-catalog.git-blob"
          if test -f .proofgrid-upstream/indata-v13/doc/identifiers/EN15804+A2_EF3.1_indicators.csv; then
            sha256sum .proofgrid-upstream/indata-v13/doc/identifiers/EN15804+A2_EF3.1_indicators.csv | tee "$OUT/ef31-catalog.sha256"
            git -C .proofgrid-upstream/indata-v13 hash-object doc/identifiers/EN15804+A2_EF3.1_indicators.csv | tee "$OUT/ef31-catalog.git-blob"
          fi

      - name: Discover exchange/module/scenario/value structure
        shell: bash
        run: |
          set -euo pipefail
          python conformance/indicator-extraction-v11/research_probe.py \
            --v12-root .proofgrid-upstream/indata-v12 \
            --v13-root .proofgrid-upstream/indata-v13 \
            --output /tmp/proofgrid-v11-research/indicator-structure-research-receipt.json

      - name: Require bounded research verdict without accepting extractor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/proofgrid-v11-research/indicator-structure-research-receipt.json'))
          assert d['verdict']=='DECLARED_INDICATOR_STRUCTURE_RESEARCH_VERIFIABLE'
          assert d['catalogue']['gwp_total']['uuid']=='6a37f984-a4b3-458a-a20a-64418c145fa2'
          assert d['catalogue']['gwp_total']['version']=='04.00.016'
          assert d['catalogue']['gwp_total']['unit_en']=='kg CO2 eqv.'
          assert d['v12']['gwp_total_exchange_count'] >= 1
          assert d['v13']['gwp_total_exchange_count'] >= 1
          assert d['extractor_accepted'] is False
          assert d['scientific_validation_performed'] is False
          assert d['professional_review_performed'] is False
          assert d['certified'] is False
          print('DECLARED_INDICATOR_STRUCTURE_RESEARCH=PASS')
          print('receipt_sha256=',d['receipt_sha256'])
          PY

      - name: Retain research receipt and catalogue identities
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v11-indicator-structure-research
          path: |
            /tmp/proofgrid-v11-research/indicator-structure-research-receipt.json
            /tmp/proofgrid-v11-research/ef30-catalog.sha256
            /tmp/proofgrid-v11-research/ef30-catalog.git-blob
            /tmp/proofgrid-v11-research/ef31-catalog.sha256
            /tmp/proofgrid-v11-research/ef31-catalog.git-blob
          if-no-files-found: warn
          retention-days: 30
