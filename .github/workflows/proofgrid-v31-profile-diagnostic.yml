name: ProofGrid v3.1 Real ÖKOBAUDAT Profile Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/proofgrid-v31-profile-diagnostic.yml"
      - "conformance/oekobaudat-v12/OekobaudatProfileProbe.java"

permissions:
  contents: read

jobs:
  diagnose-real-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve exact validator/profile stack
        run: |
          set -euo pipefail
          ROOT=/tmp/v31-profile-diagnostic
          mkdir -p "$ROOT/classes" "$ROOT/package"
          cat > "$ROOT/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>proofgrid.v31</groupId><artifactId>diagnostic</artifactId><version>3.1.0</version><dependencies><dependency><groupId>com.okworx.ilcd.validation</groupId><artifactId>ilcd-validation</artifactId><version>2.12.2</version></dependency><dependency><groupId>com.okworx.ilcd.validation.profiles</groupId><artifactId>EPD-1.2-OEKOBAUDAT</artifactId><version>3.8.0</version></dependency></dependencies></project>
          POM
          mvn -B -ntp -f "$ROOT/pom.xml" dependency:go-offline
          mvn -B -ntp -f "$ROOT/pom.xml" dependency:build-classpath -Dmdep.outputFile="$ROOT/classpath.txt" -Dmdep.pathSeparator=:
          PROFILE="$HOME/.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0/EPD-1.2-OEKOBAUDAT-3.8.0.jar"
          test "$(sha256sum "$PROFILE" | awk '{print $1}')" = "96ee05b9cf5172a344df3ea844aa8d94060eae4e4e8188f72e46441a3d61921e"
          printf '%s\n' "$PROFILE" > "$ROOT/profile-path.txt"
          javac -encoding UTF-8 -cp "$(cat "$ROOT/classpath.txt")" -d "$ROOT/classes" conformance/oekobaudat-v12/OekobaudatProfileProbe.java
      - name: Fetch and unpack exact real source
        run: |
          set -euo pipefail
          ROOT=/tmp/v31-profile-diagnostic
          curl --fail --location --retry 4 --retry-delay 2 "https://www.oekobaudat.de/OEKOBAU.DAT/resource/processes/8347f9a7-f4ec-4a36-a266-a0281f5fd16d/zipexport?version=00.02.000" -o "$ROOT/dataset.zip"
          unzip -q "$ROOT/dataset.zip" -d "$ROOT/package"
          test "$(sha256sum "$ROOT/package/ILCD/processes/8347f9a7-f4ec-4a36-a266-a0281f5fd16d_00.02.000.xml" | awk '{print $1}')" = "18951c19002314adb6213d05783f8075553102a1bc57e22950d941a4804e445d"
      - name: Run exact official profile and print all error events
        run: |
          set -euo pipefail
          ROOT=/tmp/v31-profile-diagnostic
          CP="$(cat "$ROOT/classpath.txt"):$ROOT/classes"
          PROFILE="$(cat "$ROOT/profile-path.txt")"
          java -Djava.net.useSystemProxies=false -cp "$CP" proofgrid.v08.OekobaudatProfileProbe "$PROFILE" "$ROOT/package" "$ROOT/profile-result.json" real-oekobaudat-c25-30
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/v31-profile-diagnostic/profile-result.json').read_text())
          print('PROFILE_SUMMARY',json.dumps({k:r[k] for k in ('profile_name','profile_version','is_positive','error_count','warning_count','event_count')},sort_keys=True))
          for e in r['events']:
              if e.get('severity')=='ERROR':
                  print('PROFILE_ERROR_EVENT',json.dumps(e,sort_keys=True,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v31-real-profile-diagnostic
          path: /tmp/v31-profile-diagnostic/profile-result.json
          if-no-files-found: error
          retention-days: 30
