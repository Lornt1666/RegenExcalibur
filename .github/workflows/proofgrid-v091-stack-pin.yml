name: ProofGrid v0.9.1 Exact Stack Pin

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v091-stack-pin.yml'
      - 'reference/environmental_admission_v091.py'
      - 'tests/test_environmental_admission_v091.py'
      - 'conformance/oekobaudat-v12/**'
      - 'requirements-proofgrid.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-stack-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.16'

      - name: Setup Java 17
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ProofGrid dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-proofgrid.txt
          python -m pip check

      - name: Run inherited and v0.9.1 fail-closed tests
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_environmental_admission tests.test_environmental_admission_v091

      - name: Checkout pinned InData v1.2 samples
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData master data
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Master-Data
          ref: 32117b6a70d6c486344247a429449755a2c7eab4
          path: .proofgrid-upstream/indata-master
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify exact official validator/profile stack
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v091
          mkdir -p "$OUT/classes"
          cat > "$OUT/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>proofgrid.v091</groupId>
            <artifactId>exact-stack-pin</artifactId>
            <version>0.9.1</version>
            <dependencies>
              <dependency>
                <groupId>com.okworx.ilcd.validation</groupId>
                <artifactId>ilcd-validation</artifactId>
                <version>2.12.2</version>
              </dependency>
              <dependency>
                <groupId>com.okworx.ilcd.validation.profiles</groupId>
                <artifactId>EPD-1.2-OEKOBAUDAT</artifactId>
                <version>3.8.0</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn -B -ntp -f "$OUT/pom.xml" dependency:go-offline
          mvn -B -ntp -f "$OUT/pom.xml" dependency:build-classpath -Dmdep.outputFile="$OUT/classpath.txt" -Dmdep.pathSeparator=:
          LIB="$HOME/.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2/ilcd-validation-2.12.2.jar"
          LIB_POM="$HOME/.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2/ilcd-validation-2.12.2.pom"
          PROFILE_DIR="$HOME/.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0"
          PROFILE="$PROFILE_DIR/EPD-1.2-OEKOBAUDAT-3.8.0.jar"
          PROFILE_POM="$PROFILE_DIR/EPD-1.2-OEKOBAUDAT-3.8.0.pom"
          test "$(sha256sum "$LIB" | awk '{print $1}')" = '55427919601b5deceee99b34fbbbaf8f00cbcf0aca1fdb1eb493c31f473e077b'
          test "$(sha256sum "$LIB_POM" | awk '{print $1}')" = '16430562fe6ebb6da3e4afea4a8c6cce98d822d61f59eb33e0b5dc98a4eb1fc1'
          test "$(sha256sum "$PROFILE" | awk '{print $1}')" = '96ee05b9cf5172a344df3ea844aa8d94060eae4e4e8188f72e46441a3d61921e'
          test "$(sha256sum "$PROFILE_POM" | awk '{print $1}')" = '0188dfb7ee16feb4c20c58003f419db7e5007382be7794d47cfd56d67a39047a'
          test "$(unzip -p "$PROFILE" includes/EPD-1.2-Generic.jar | sha256sum | awk '{print $1}')" = '31402bb2746ddb9d2ab4ce40dd5d3e848ab701d1f4da00f2da004f15c7e1cc25'
          test "$(unzip -p "$PROFILE" includes/EPD-1.2-EN15804.jar | sha256sum | awk '{print $1}')" = 'a05ac55df8f567985da8c95e30ff6579761d336e0f23087aa73fefb4d9a2b147'
          printf '%s\n' "$PROFILE" > "$OUT/profile-path.txt"
          javac -encoding UTF-8 -cp "$(cat "$OUT/classpath.txt")" -d "$OUT/classes" conformance/oekobaudat-v12/OekobaudatProfileProbe.java

      - name: Stage authority-safe v1.2 package and preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v091
          PROFILE=$(cat "$OUT/profile-path.txt")
          python conformance/oekobaudat-v12/build_authority_safe_fixture.py \
            --sample-root .proofgrid-upstream/indata-v12/sample_data \
            --master-root .proofgrid-upstream/indata-master \
            --profile-jar "$PROFILE" \
            --output-root "$OUT/source-dir"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('/tmp/proofgrid-v091'); src=root/'source-dir'; pkg=root/'package'; pkg.mkdir()
          z=pkg/'source.zip'
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED) as zf:
              for path in sorted((src/'ILCD').rglob('*')):
                  if not path.is_file(): continue
                  info=zipfile.ZipInfo(path.relative_to(src).as_posix()); info.date_time=(1980,1,1,0,0,0); info.external_attr=0o100644<<16
                  zf.writestr(info,path.read_bytes())
          terms=pkg/'terms.txt'; terms.write_text('ProofGrid v0.9.1 TEST_ONLY authority for exact-stack acceptance.\n')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'schema_version':'1.0','import_id':'RX-V091-V12','manifest_version':'1.0',
            'provider':{'name':'RegenExcalibur synthetic authority-safe fixture','program':'ProofGrid v0.9.1','source_locator':'local:v091'},
            'acquisition':{'method':'TEST_FIXTURE','synthetic':True,'intended_use':'INTERNAL_TEST'},
            'authorization':{'status':'TEST_ONLY','commercial_use':'PROHIBITED','storage':'ALLOWED','transformation':'ALLOWED','redistribution':'PROHIBITED','terms_reference':'v0.9.1 test authority','terms_snapshot':{'path':'terms.txt','sha256':sha(terms)},'approval_reference':None,'valid_until':None},
            'source':{'path':'source.zip','sha256':sha(z),'media_type':'application/zip','declared_format':{'name':'ILCD+EPD','version':'1.2'}},
            'parser':{'name':'proofgrid-ilcd-epd-admission-router','version':'0.9.0','profile':'auto-v1.2-v1.3'},
            'normalized_record_id':'RX-V091-V12'
          }
          (pkg/'import-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          python reference/environmental_admission_v091.py preflight "$OUT/package" --as-of 2026-08-20 --output "$OUT/preflight.json"

      - name: Run exact official profile and emit full-stack conformance receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v091
          PROFILE=$(cat "$OUT/profile-path.txt")
          CP=$(cat "$OUT/classpath.txt"):$OUT/classes
          java -Djava.net.useSystemProxies=false -cp "$CP" proofgrid.v08.OekobaudatProfileProbe "$PROFILE" "$OUT/source-dir" "$OUT/profile-result.json" v091
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from reference import environmental_admission_v091 as a
          root=Path('/tmp/proofgrid-v091')
          pre=json.loads((root/'preflight.json').read_text()); result=json.loads((root/'profile-result.json').read_text())
          assert result['error_count']==0 and result['is_positive'] is True
          body={
            'claim_token':a.V12_CLAIM,'compatibility_claim':True,
            'compatibility_scope':'v0.9.1 exact-stack hosted synthetic control',
            'certified':False,'authority_inference_allowed':False,'real_provider_epd_tested':False,
            'package_manifest_sha256':pre['source']['package_manifest_sha256'],
            'official_validator':a.V12_OFFICIAL_VALIDATOR,
            'official_profile':a.V12_OFFICIAL_PROFILE,
            'positive_control':{'error_count':0,'warning_count':result['warning_count'],'is_positive':True},
            'limitations':['Synthetic hosted control; not certification or provider authorization.']
          }
          body['receipt_sha256']=a.sha256_bytes(a.canonical_json_bytes(body))
          (root/'conformance.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY
          python reference/environmental_admission_v091.py finalize --preflight "$OUT/preflight.json" --conformance "$OUT/conformance.json" --output "$OUT/admission.json"

      - name: Require forged full-stack receipt rejection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from reference import environmental_admission_v091 as a
          root=Path('/tmp/proofgrid-v091')
          pre=json.loads((root/'preflight.json').read_text()); conf=json.loads((root/'conformance.json').read_text())
          conf.pop('receipt_sha256',None); conf['official_profile']['jar_sha256']='9'*64
          conf['receipt_sha256']=a.sha256_bytes(a.canonical_json_bytes(conf))
          try:
              a.finalize(pre,conf)
          except a.AdmissionError as exc:
              assert 'ÖKOBAUDAT profile stack' in str(exc), exc
              print('FORGED_STACK_REJECTED=PASS')
          else:
              raise SystemExit('forged profile stack was admitted')
          PY

      - name: Produce v0.9.1 acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from reference import environmental_admission_v091 as a
          root=Path('/tmp/proofgrid-v091')
          pre=json.loads((root/'preflight.json').read_text()); conf=json.loads((root/'conformance.json').read_text()); adm=json.loads((root/'admission.json').read_text())
          receipt={
            'verdict':'ENVIRONMENTAL_DECLARATION_ADMISSION_V091_EXACT_STACK_VERIFIABLE',
            'certified':False,'engine_version':'0.9.1',
            'source_sha256':adm['source']['sha256'],'package_manifest_sha256':adm['source']['package_manifest_sha256'],
            'preflight_receipt_sha256':pre['receipt_sha256'],'conformance_receipt_sha256':conf['receipt_sha256'],'admission_receipt_sha256':adm['receipt_sha256'],
            'official_validator':a.V12_OFFICIAL_VALIDATOR,'official_profile':a.V12_OFFICIAL_PROFILE,
            'positive_control':{'profile_positive':adm['conformance']['profile_positive'],'error_count':adm['conformance']['error_count'],'warning_count':adm['conformance']['warning_count']},
            'forged_stack_negative':'REJECTED',
            'limitations':['Exact-stack admission is a software/provenance result, not scientific validation, professional review, provider authorization, BBSR approval, or certification.']
          }
          receipt['receipt_sha256']=a.sha256_bytes(a.canonical_json_bytes(receipt))
          (root/'v091-acceptance-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Retain receipts only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v091-exact-stack-pin
          path: |
            /tmp/proofgrid-v091/preflight.json
            /tmp/proofgrid-v091/profile-result.json
            /tmp/proofgrid-v091/conformance.json
            /tmp/proofgrid-v091/admission.json
            /tmp/proofgrid-v091/v091-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 30
