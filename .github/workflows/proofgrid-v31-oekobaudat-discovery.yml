name: ProofGrid v3.1 ÖKOBAUDAT Source Discovery

on:
  pull_request:
    paths:
      - "conformance/real-environmental-source-v31/REAL_OEKOBAUDAT_SOURCE.json"
      - ".github/workflows/proofgrid-v31-oekobaudat-discovery.yml"
      - "requirements-proofgrid.txt"

permissions:
  contents: read
  actions: read

jobs:
  discovery-replica:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UUID: "8347f9a7-f4ec-4a36-a266-a0281f5fd16d"
      VERSION: "00.02.000"
      ZIP_URL: "https://www.oekobaudat.de/OEKOBAU.DAT/resource/processes/8347f9a7-f4ec-4a36-a266-a0281f5fd16d/zipexport?version=00.02.000"
      JSON_URL: "https://www.oekobaudat.de/OEKOBAU.DAT/resource/processes/8347f9a7-f4ec-4a36-a266-a0281f5fd16d?format=JSON&view=extended&version=00.02.000"
      TERMS_URL: "https://www.oekobaudat.de/en/guidance/data-users.html"
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11.16"
      - name: Verify discovery manifest target and fail-closed rights semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('conformance/real-environmental-source-v31/REAL_OEKOBAUDAT_SOURCE.json').read_text())
          assert m['dataset']['uuid']=='8347f9a7-f4ec-4a36-a266-a0281f5fd16d'
          assert m['dataset']['version']=='00.02.000'
          assert m['dataset']['format']=='ILCD+EPD v1.2'
          assert m['dataset']['declared_reference']=={'quantity':'1','unit':'m3'}
          assert m['dataset']['expected_indicator_control']=={
            'indicator':'GWP-total','module':'A1-A3','scenario':None,'value_decimal':'181','unit':'kg CO2 eqv.'}
          assert m['rights']['read_use']=='ALLOWED'
          assert m['rights']['unmodified_redistribution']=='ALLOWED_WITH_SOURCE_ATTRIBUTION'
          assert m['rights']['modified_or_raw_redistribution']=='UNKNOWN_REQUIRES_SEPARATE_EVIDENCE'
          assert m['rights']['scientific_validity_guaranteed_by_provider'] is False
          assert m['rights']['professional_suitability_inferred'] is False
          assert m['rights']['certification_authority_inferred'] is False
          assert m['discovery']['source_sha256_state']=='DISCOVERY_PENDING'
          PY
      - name: Fetch official ZIP transport, extended API view, and data-user terms
        run: |
          set -euo pipefail
          ROOT="/tmp/v31-${{ matrix.replica }}"
          mkdir -p "${ROOT}"
          curl --fail --location --retry 4 --retry-delay 2 \
            -H 'Accept: application/zip, application/octet-stream;q=0.9, */*;q=0.1' \
            "${ZIP_URL}" -o "${ROOT}/dataset.zip"
          curl --fail --location --retry 4 --retry-delay 2 \
            -H 'Accept: application/json, application/xml;q=0.8, */*;q=0.1' \
            "${JSON_URL}" -o "${ROOT}/extended.json"
          curl --fail --location --retry 4 --retry-delay 2 \
            "${TERMS_URL}" -o "${ROOT}/terms.html"
      - name: Canonicalize uncompressed ILCD package identity and target process
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('/tmp/v31-${{ matrix.replica }}')
          zpath=root/'dataset.zip'
          if not zipfile.is_zipfile(zpath):
              raise SystemExit('ÖKOBAUDAT zipexport did not return a ZIP archive')
          with zipfile.ZipFile(zpath) as z:
              names=sorted(z.namelist())
              if not names:
                  raise SystemExit('ÖKOBAUDAT ZIP is empty')
              if any(name.startswith('/') or '..' in Path(name).parts for name in names):
                  raise SystemExit('unsafe ZIP path detected')
              members=[]
              target=[]
              for name in names:
                  data=z.read(name)
                  members.append({
                    'path':name,
                    'size_bytes':len(data),
                    'sha256':hashlib.sha256(data).hexdigest(),
                  })
                  if name.lower().endswith('.xml') and ('process' in name.lower() or 'processes/' in name.lower()):
                      if b'8347f9a7-f4ec-4a36-a266-a0281f5fd16d' in data:
                          target.append(name)
              if len(target)!=1:
                  raise SystemExit(f'expected one target process XML, found {len(target)}: {target[:10]}')
              process_bytes=z.read(target[0])
              text=process_bytes.decode('utf-8',errors='strict')
              version_marker_found='00.02.000' in text or 'version="00.02.000"' in text
              canonical_members=json.dumps(members,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
              package_manifest={
                  'schema_version':'1.0',
                  'verdict':'REAL_OEKOBAUDAT_CANONICAL_PACKAGE_DISCOVERY_VERIFIABLE',
                  'dataset_uuid':'8347f9a7-f4ec-4a36-a266-a0281f5fd16d',
                  'requested_version':'00.02.000',
                  'member_count':len(members),
                  'members':members,
                  'package_content_manifest_sha256':hashlib.sha256(canonical_members).hexdigest(),
                  'target_process_path':target[0],
                  'target_process_size_bytes':len(process_bytes),
                  'target_process_sha256':hashlib.sha256(process_bytes).hexdigest(),
                  'requested_version_marker_found_in_process_xml':version_marker_found,
              }
              (root/'canonical-package-manifest.json').write_text(json.dumps(package_manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
              (root/'target-process.xml').write_bytes(process_bytes)
          PY
      - name: Freeze deterministic source fingerprints and separate volatile transport metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/v31-${{ matrix.replica }}')
          def fp(name):
              p=root/name
              return {'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          package=json.loads((root/'canonical-package-manifest.json').read_text())
          deterministic={
            'verdict':'REAL_OEKOBAUDAT_SOURCE_DISCOVERY_VERIFIABLE',
            'dataset_uuid':'8347f9a7-f4ec-4a36-a266-a0281f5fd16d',
            'requested_version':'00.02.000',
            'package_member_count':package['member_count'],
            'package_content_manifest_sha256':package['package_content_manifest_sha256'],
            'target_process_path':package['target_process_path'],
            'target_process_sha256':package['target_process_sha256'],
            'target_process_size_bytes':package['target_process_size_bytes'],
            'extended_view':fp('extended.json'),
            'terms_page':fp('terms.html'),
            'final_admission_eligible':False,
            'reason':'DISCOVERY_ONLY_HASHES_NOT_YET_FROZEN_IN_SOURCE_MANIFEST',
          }
          canonical=json.dumps(deterministic,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          deterministic['receipt_sha256']=hashlib.sha256(canonical).hexdigest()
          (root/'discovery-receipt.json').write_text(json.dumps(deterministic,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          transport={
            'verdict':'NON_AUTHORITATIVE_TRANSPORT_METADATA',
            'zip_wrapper':fp('dataset.zip'),
            'note':'ÖKOBAUDAT zipexport wrapper bytes may vary by request; authority is the canonical uncompressed member manifest.'
          }
          (root/'transport-metadata.json').write_text(json.dumps(transport,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(deterministic,indent=2,sort_keys=True))
          print(json.dumps(transport,indent=2,sort_keys=True))
          PY
      - name: Check published rights markers without promoting scientific authority
        run: |
          set -euo pipefail
          ROOT="/tmp/v31-${{ matrix.replica }}"
          grep -qi 'free of charge' "${ROOT}/terms.html"
          grep -qi 'without any restrictions' "${ROOT}/terms.html"
          grep -qi 'free distribution of unmodified data' "${ROOT}/terms.html"
          grep -qi 'source is named' "${ROOT}/terms.html"
          grep -qi 'no responsibility for the accuracy' "${ROOT}/terms.html"
      - name: Upload discovery evidence only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v31-oekobaudat-discovery-${{ matrix.replica }}
          path: |
            /tmp/v31-${{ matrix.replica }}/canonical-package-manifest.json
            /tmp/v31-${{ matrix.replica }}/target-process.xml
            /tmp/v31-${{ matrix.replica }}/discovery-receipt.json
            /tmp/v31-${{ matrix.replica }}/transport-metadata.json
          if-no-files-found: error
          retention-days: 30

  compare-discovery:
    needs: discovery-replica
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: proofgrid-v31-oekobaudat-discovery-a
          path: /tmp/v31/a
      - uses: actions/download-artifact@v4.3.0
        with:
          name: proofgrid-v31-oekobaudat-discovery-b
          path: /tmp/v31/b
      - name: Require independent native package-content identity
        run: |
          set -euo pipefail
          diff -u /tmp/v31/a/canonical-package-manifest.json /tmp/v31/b/canonical-package-manifest.json
          diff -u /tmp/v31/a/target-process.xml /tmp/v31/b/target-process.xml
          diff -u /tmp/v31/a/discovery-receipt.json /tmp/v31/b/discovery-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/v31/a/discovery-receipt.json').read_text())
          assert r['final_admission_eligible'] is False
          print('DISCOVERY_PACKAGE_CONTENT_MANIFEST_SHA256='+r['package_content_manifest_sha256'])
          print('DISCOVERY_PROCESS_SHA256='+r['target_process_sha256'])
          print('DISCOVERY_TERMS_SHA256='+r['terms_page']['sha256'])
          print('DISCOVERY_EXTENDED_SHA256='+r['extended_view']['sha256'])
          PY
