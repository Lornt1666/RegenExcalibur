name: ProofGrid v1.3 Reference Basis Research

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v13-reference-basis-research.yml'
      - 'conformance/reference-basis-v13/**'
      - 'requirements-proofgrid-v07.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-basis-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11.16'

      - name: Checkout pinned InData v1.2 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData v1.3 source
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: 7625c7dfc0d5b6bc2020eb0cf0b0503349c914aa
          path: .proofgrid-upstream/indata-v13
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData master data
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Master-Data
          ref: 32117b6a70d6c486344247a429449755a2c7eab4
          path: .proofgrid-upstream/indata-master
          fetch-depth: 1
          persist-credentials: false

      - name: Run deterministic quantitative-reference research probe
        shell: bash
        run: |
          set -euo pipefail
          python conformance/reference-basis-v13/research_probe.py \
            --v12-root .proofgrid-upstream/indata-v12 \
            --v13-root .proofgrid-upstream/indata-v13 \
            --master-root .proofgrid-upstream/indata-master \
            --output /tmp/proofgrid-v13-reference-basis-research.json

      - name: Require bounded pinned-fixture identity chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='/tmp/proofgrid-v13-reference-basis-research.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['verdict']=='DECLARED_REFERENCE_BASIS_RESEARCH_VERIFIABLE'
          assert d['extractor_accepted'] is False
          assert d['calculated'] is False
          assert d['environmental_values_transformed'] is False
          assert d['unit_conversion_performed'] is False
          assert d['scientific_validation_performed'] is False
          assert d['professional_review_performed'] is False
          assert d['certified'] is False
          assert d['v12']['process']['reference_exchange_internal_id']=='42'
          assert d['v13']['process']['reference_exchange_internal_id']=='42'
          assert d['v12']['process']['product_flow_uuid']=='a7432abd-0881-4977-a817-f8aaf627fb91'
          assert d['v13']['process']['product_flow_uuid']=='a7432abd-0881-4977-a817-f8aaf627fb91'
          assert d['v12']['process']['exchange_amount']['lexical']=='1.0'
          assert d['v12']['process']['exchange_amount']['decimal']=='1'
          assert d['v13']['process']['exchange_amount']['decimal']=='1'
          assert d['v12']['flow']['reference_flow_property_internal_id']=='0'
          assert d['v13']['flow']['reference_flow_property_internal_id']=='0'
          assert d['v12']['flow']['flow_property_uuid']=='93a60a56-a3c8-11da-a746-0800200b9a66'
          assert d['v13']['flow']['flow_property_uuid']=='93a60a56-a3c8-11da-a746-0800200b9a66'
          assert d['v12']['flow']['flow_property_mean']['decimal']=='1'
          assert d['v13']['flow']['flow_property_mean']['decimal']=='1'
          assert d['flow_property_master']['reference_unit_group_uuid']=='ad38d542-3fe9-439d-9b95-2f5f7752acaf'
          assert d['unit_group_master']['reference_unit_internal_id']=='0'
          assert d['unit_group_master']['reference_unit_name']=='kg'
          assert d['unit_group_master']['reference_unit_factor']['decimal']=='1'
          assert d['initial_known_answer']['identity_chain'] is True
          assert d['initial_known_answer']['bounded_basis_text']=='1 kg of the referenced wood-panel product flow'
          print('REFERENCE_BASIS_RESEARCH=PASS')
          print('receipt_sha256=',d['receipt_sha256'])
          PY

      - name: Retain research receipt only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v13-reference-basis-research
          path: /tmp/proofgrid-v13-reference-basis-research.json
          if-no-files-found: error
          retention-days: 30
