name: ProofGrid v0.8 Synthetic Profile Iteration

on:
  pull_request:
    paths:
      - "conformance/oekobaudat-v12/build_synthetic_fixture.py"
      - "conformance/oekobaudat-v12/OekobaudatProfileProbe.java"
      - ".github/workflows/proofgrid-v08-synthetic-iteration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-synthetic-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Java 17
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout pinned InData v1.2 samples
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Data-Format
          ref: b7233bd2dd5435a6b5973505ffa212cd03d23468
          path: .proofgrid-upstream/indata-v12
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned InData master data
        uses: actions/checkout@v6.1.0
        with:
          repository: InDataWG/ILCD-EPD-Master-Data
          ref: 32117b6a70d6c486344247a429449755a2c7eab4
          path: .proofgrid-upstream/indata-master
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify exact official validator/profile stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proofgrid-v08-synthetic
          cat > /tmp/proofgrid-v08-synthetic/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>proofgrid.v08</groupId><artifactId>synthetic-profile</artifactId><version>1.0.0</version>
            <dependencies>
              <dependency><groupId>com.okworx.ilcd.validation</groupId><artifactId>ilcd-validation</artifactId><version>2.12.2</version></dependency>
              <dependency><groupId>com.okworx.ilcd.validation.profiles</groupId><artifactId>EPD-1.2-OEKOBAUDAT</artifactId><version>3.8.0</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -B -ntp -f /tmp/proofgrid-v08-synthetic/pom.xml dependency:go-offline
          mvn -B -ntp -f /tmp/proofgrid-v08-synthetic/pom.xml dependency:build-classpath \
            -Dmdep.outputFile=/tmp/proofgrid-v08-synthetic/classpath.txt -Dmdep.pathSeparator=:
          LIB="$HOME/.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2/ilcd-validation-2.12.2.jar"
          PROFILE="$HOME/.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0/EPD-1.2-OEKOBAUDAT-3.8.0.jar"
          test "$(sha256sum "$LIB" | awk '{print $1}')" = "55427919601b5deceee99b34fbbbaf8f00cbcf0aca1fdb1eb493c31f473e077b"
          test "$(sha256sum "$PROFILE" | awk '{print $1}')" = "96ee05b9cf5172a344df3ea844aa8d94060eae4e4e8188f72e46441a3d61921e"
          test "$(unzip -p "$PROFILE" includes/EPD-1.2-Generic.jar | sha256sum | awk '{print $1}')" = "31402bb2746ddb9d2ab4ce40dd5d3e848ab701d1f4da00f2da004f15c7e1cc25"
          test "$(unzip -p "$PROFILE" includes/EPD-1.2-EN15804.jar | sha256sum | awk '{print $1}')" = "a05ac55df8f567985da8c95e30ff6579761d336e0f23087aa73fefb4d9a2b147"
          printf '%s\n' "$PROFILE" > /tmp/proofgrid-v08-synthetic/profile-path.txt
          CP=$(cat /tmp/proofgrid-v08-synthetic/classpath.txt)
          mkdir -p /tmp/proofgrid-v08-synthetic/classes
          javac -encoding UTF-8 -cp "$CP" -d /tmp/proofgrid-v08-synthetic/classes conformance/oekobaudat-v12/OekobaudatProfileProbe.java

      - name: Build deterministic synthetic v1.2 fixture
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=$(cat /tmp/proofgrid-v08-synthetic/profile-path.txt)
          python conformance/oekobaudat-v12/build_synthetic_fixture.py \
            --sample-root .proofgrid-upstream/indata-v12/sample_data \
            --master-root .proofgrid-upstream/indata-master \
            --profile-jar "$PROFILE" \
            --output-root /tmp/proofgrid-v08-synthetic/package
          cat /tmp/proofgrid-v08-synthetic/package/fixture-build-receipt.json

      - name: Run official ÖKOBAUDAT 3.8.0 profile
        shell: bash
        run: |
          set -euo pipefail
          CP=$(cat /tmp/proofgrid-v08-synthetic/classpath.txt):/tmp/proofgrid-v08-synthetic/classes
          PROFILE=$(cat /tmp/proofgrid-v08-synthetic/profile-path.txt)
          java -Djava.net.useSystemProxies=false -cp "$CP" \
            proofgrid.v08.OekobaudatProfileProbe \
            "$PROFILE" /tmp/proofgrid-v08-synthetic/package /tmp/proofgrid-v08-synthetic/profile-result.json synthetic-iteration-1

      - name: Enforce improvement over frozen 7-error closure baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, hashlib, json
          from pathlib import Path
          root=Path('/tmp/proofgrid-v08-synthetic')
          result=json.loads((root/'profile-result.json').read_text())
          errors=[e for e in result['events'] if e.get('severity')=='ERROR']
          warnings=[e for e in result['events'] if e.get('severity')=='WARNING']
          groups=collections.Counter((e.get('aspect'),e.get('message')) for e in errors)
          summary={
            'baseline_error_count':7,
            'error_count':len(errors),
            'warning_count':len(warnings),
            'positive':result['is_positive'],
            'error_groups':[{'count':n,'aspect':k[0],'message':k[1]} for k,n in groups.most_common()],
            'event_stream_sha256':hashlib.sha256((json.dumps(result['events'],sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest(),
          }
          payload=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['receipt_sha256']=hashlib.sha256(payload).hexdigest()
          (root/'iteration-receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          if len(errors) >= 7:
              raise SystemExit(f'iteration failed improvement gate: {len(errors)} errors is not below frozen baseline 7')
          PY

      - name: Retain iteration receipts and official event result
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v08-synthetic-iteration
          path: |
            /tmp/proofgrid-v08-synthetic/package/fixture-build-receipt.json
            /tmp/proofgrid-v08-synthetic/profile-result.json
            /tmp/proofgrid-v08-synthetic/iteration-receipt.json
          if-no-files-found: error
          retention-days: 30
