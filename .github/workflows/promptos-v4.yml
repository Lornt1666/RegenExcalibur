name: PromptOS v4 RC

on:
  pull_request:
    paths:
      - "promptos/**"
      - ".github/workflows/promptos-v4.yml"
  push:
    branches:
      - "feat/promptos-v4-*"
    paths:
      - "promptos/**"
      - ".github/workflows/promptos-v4.yml"

permissions:
  contents: read

concurrency:
  group: promptos-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: promptos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic conformance
        run: promptos conformance --output conformance-report.json
      - name: Generate corpus partitions
        run: promptos corpus --output-dir generated-corpus
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/promptos-wheel-smoke
          /tmp/promptos-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/promptos-wheel-smoke/bin/promptos conformance
