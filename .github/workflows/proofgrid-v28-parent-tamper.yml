name: ProofGrid v2.8 Third Parent Tamper

on:
  pull_request:
    paths:
      - "reference/three_member_set_v28.py"
      - ".github/workflows/proofgrid-v28-parent-tamper.yml"
      - "requirements-proofgrid.txt"

permissions:
  contents: read
  actions: read

jobs:
  reject-tampered-third-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V27_ARTIFACT_ID: "9475053941"
      V27_ZIP_SHA256: "40885a6899a01cf9430e3b7c9834e63dcc52ea6a87ad964bd1d8c714dde1a850"
      V26_ARTIFACT_ID: "9474464410"
      V26_ZIP_SHA256: "ea0226b482e74bceda2afc0cdbe34a79295c28b442b45f96601ce2a7f303f90e"
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with: {python-version: "3.11.16", check-latest: false}
      - name: Install exact ProofGrid dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-proofgrid.txt
          python -m pip check
      - name: Download exact accepted third RXEP and calculation parents
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v28-negative/{v27,v26}
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V27_ARTIFACT_ID}/zip" > /tmp/v28-negative/v27.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V26_ARTIFACT_ID}/zip" > /tmp/v28-negative/v26.zip
          echo "${V27_ZIP_SHA256}  /tmp/v28-negative/v27.zip" | sha256sum -c -
          echo "${V26_ZIP_SHA256}  /tmp/v28-negative/v26.zip" | sha256sum -c -
          unzip -q /tmp/v28-negative/v27.zip -d /tmp/v28-negative/v27
          unzip -q /tmp/v28-negative/v26.zip -d /tmp/v28-negative/v26
      - name: Require actual admission verifier to reject tampered v2.7 RXEP bytes
        run: |
          set -euo pipefail
          printf ' ' >> /tmp/v28-negative/v27/third-rxep-calculated-contribution.json
          python - <<'PY'
          from pathlib import Path
          from reference import three_member_set_v28 as m
          root=Path('/tmp/v28-negative')
          rx,rxraw=m.load(root/'v27/third-rxep-calculated-contribution.json')
          rr,rrraw=m.load(root/'v27/third-rxep-calculated-contribution-receipt.json')
          calc,craw=m.load(root/'v26/third-mapped-declared-result-calculation.json')
          cr,crraw=m.load(root/'v26/third-mapped-declared-result-calculation-receipt.json')
          try:
              m.verify_third(rx,rxraw,rr,rrraw,calc,craw,cr,crraw)
          except m.SetAdmissionError as exc:
              print('THIRD_PARENT_TAMPER_REJECTED=PASS')
              print(str(exc))
          else:
              raise SystemExit('tampered v2.7 RXEP unexpectedly accepted by verify_third')
          PY
