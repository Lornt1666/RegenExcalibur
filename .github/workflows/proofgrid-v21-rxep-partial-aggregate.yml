name: ProofGrid v2.1 RXEP Partial Aggregate

on:
  pull_request:
    paths:
      - "reference/rxep_partial_aggregate_v21.py"
      - "tests/test_rxep_partial_aggregate_v21.py"
      - "conformance/rxep-partial-aggregate-v21/**"
      - "specs/rxep/**"
      - ".github/workflows/proofgrid-v21-rxep-partial-aggregate.yml"
      - "requirements-proofgrid.txt"

permissions:
  contents: read
  actions: read

jobs:
  reproduce-rxep:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V20_ARTIFACT_ID: "9464376763"
      V20_ZIP_SHA256: "9b63ae70c4db86e2b01577bcc433471ad705a3aedcc590cf028fd874d95e677b"

    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11.16"
          check-latest: false

      - name: Install exact ProofGrid dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-proofgrid.txt
          python -m pip check

      - name: Run v2.1 fail-closed unit suite
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_rxep_partial_aggregate_v21

      - name: Download and SHA-verify accepted v2.0 artifact independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="/tmp/proofgrid-v21-${{ matrix.replica }}"
          mkdir -p "${ROOT}"/{v20,out}
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V20_ARTIFACT_ID}/zip" > "${ROOT}/v20.zip"
          echo "${V20_ZIP_SHA256}  ${ROOT}/v20.zip" | sha256sum -c -
          unzip -q "${ROOT}/v20.zip" -d "${ROOT}/v20"

      - name: Bind accepted PARTIAL aggregate into RXEP
        run: |
          set -euo pipefail
          ROOT="/tmp/proofgrid-v21-${{ matrix.replica }}"
          python reference/rxep_partial_aggregate_v21.py \
            --aggregate-record "${ROOT}/v20/a/partial-contribution-set-exact-decimal-total.json" \
            --aggregate-receipt "${ROOT}/v20/a/partial-contribution-set-exact-decimal-total-receipt.json" \
            --comparison-receipt "${ROOT}/v20/v20-independent-comparison-receipt.json" \
            --output-dir "${ROOT}/out"

      - name: Assert exact Decimal authority and PARTIAL state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/proofgrid-v21-${{ matrix.replica }}/out')
          e=json.loads((root/'rxep-exact-decimal-partial-aggregate.json').read_text())
          r=json.loads((root/'rxep-exact-decimal-partial-aggregate-receipt.json').read_text())
          assert e['measurement']['value_decimal']=='23339.2195157455485'
          assert e['measurement']['decimal_value_is_authority'] is True
          assert e['measurement']['numeric_value_is_authority'] is False
          assert e['measurement']['numeric_value_role']=='NON_AUTHORITATIVE_DISPLAY'
          assert e['review']=={'state':'CALCULATED','reviewer':None}
          assert e['member_count']==2
          assert e['completeness_status']=='PARTIAL'
          assert e['aggregation_performed'] is True and e['sum_performed'] is True
          assert e['whole_building_lca_claimed'] is False
          assert e['declared_scope_complete_claimed'] is False
          assert e['certified'] is False
          assert r['verdict']=='RXEP_EXACT_DECIMAL_PARTIAL_AGGREGATE_EVIDENCE_VERIFIABLE'
          assert r['value_decimal']=='23339.2195157455485'
          assert r['review_state']=='CALCULATED'
          print('RXEP_V21_EXACT_DECIMAL='+e['measurement']['value_decimal'])
          print('RXEP_V21_DISPLAY_VALUE='+str(e['measurement']['value']))
          PY

      - name: Upload replica RXEP evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v21-rxep-replica-${{ matrix.replica }}
          path: |
            /tmp/proofgrid-v21-${{ matrix.replica }}/out/rxep-exact-decimal-partial-aggregate.json
            /tmp/proofgrid-v21-${{ matrix.replica }}/out/rxep-exact-decimal-partial-aggregate-receipt.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: reproduce-rxep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V20_ARTIFACT_ID: "9464376763"
      V20_ZIP_SHA256: "9b63ae70c4db86e2b01577bcc433471ad705a3aedcc590cf028fd874d95e677b"

    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Install exact ProofGrid dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-proofgrid.txt
          python -m pip check

      - name: Download replica A
        uses: actions/download-artifact@v4.3.0
        with:
          name: proofgrid-v21-rxep-replica-a
          path: /tmp/v21/a
      - name: Download replica B
        uses: actions/download-artifact@v4.3.0
        with:
          name: proofgrid-v21-rxep-replica-b
          path: /tmp/v21/b

      - name: Require RXEP record and receipt byte identity
        run: |
          set -euo pipefail
          diff -u /tmp/v21/a/rxep-exact-decimal-partial-aggregate.json /tmp/v21/b/rxep-exact-decimal-partial-aggregate.json
          diff -u /tmp/v21/a/rxep-exact-decimal-partial-aggregate-receipt.json /tmp/v21/b/rxep-exact-decimal-partial-aggregate-receipt.json

      - name: Require tampered accepted v2.0 parent to fail closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v21/parent
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V20_ARTIFACT_ID}/zip" > /tmp/v21/parent/v20.zip
          echo "${V20_ZIP_SHA256}  /tmp/v21/parent/v20.zip" | sha256sum -c -
          unzip -q /tmp/v21/parent/v20.zip -d /tmp/v21/parent/v20
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/v21/parent/v20/a/partial-contribution-set-exact-decimal-total.json')
          o=json.loads(p.read_text())
          o['aggregation']['total_value_decimal']='23340.2195157455485'
          o['integrity']['content_sha256']='0'*64
          canonical=json.dumps(o,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          o['integrity']['content_sha256']=hashlib.sha256(canonical).hexdigest()
          p.write_text(json.dumps(o,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY
          set +e
          python reference/rxep_partial_aggregate_v21.py \
            --aggregate-record /tmp/v21/parent/v20/a/partial-contribution-set-exact-decimal-total.json \
            --aggregate-receipt /tmp/v21/parent/v20/a/partial-contribution-set-exact-decimal-total-receipt.json \
            --comparison-receipt /tmp/v21/parent/v20/v20-independent-comparison-receipt.json \
            --output-dir /tmp/v21/tampered-out
          code=$?
          set -e
          test "$code" -ne 0

      - name: Produce independent v2.1 comparison receipt
        run: |
          set -euo pipefail
          mkdir -p /tmp/v21/final
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/v21')
          e=json.loads((root/'a/rxep-exact-decimal-partial-aggregate.json').read_text())
          r=json.loads((root/'a/rxep-exact-decimal-partial-aggregate-receipt.json').read_text())
          eb=(root/'a/rxep-exact-decimal-partial-aggregate.json').read_bytes()
          rb=(root/'a/rxep-exact-decimal-partial-aggregate-receipt.json').read_bytes()
          report={
            'verdict':'RXEP_EXACT_DECIMAL_PARTIAL_AGGREGATE_EVIDENCE_INDEPENDENTLY_REPRODUCED',
            'accepted_v20_head':'2fc2c450b1f37cb2c355ff12d09622ad5f094eec',
            'replicas':['a','b'],'independent_runner_count':2,'byte_identical':True,
            'record_content_sha256':e['integrity']['content_sha256'],
            'record_file_sha256':hashlib.sha256(eb).hexdigest(),
            'receipt_sha256':r['receipt_sha256'],
            'receipt_file_sha256':hashlib.sha256(rb).hexdigest(),
            'value_decimal':'23339.2195157455485','unit':'kg CO2 eqv.','review_state':'CALCULATED',
            'member_count':2,'completeness_status':'PARTIAL','aggregation_performed':True,'sum_performed':True,
            'whole_building_lca_claimed':False,'declared_scope_complete_claimed':False,
            'scientific_validation_performed':False,'professional_review_performed':False,'certified':False,
            'tampered_parent_rejected':True
          }
          report['comparison_receipt_sha256']=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          out=root/'final/v21-independent-comparison-receipt.json'
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          cp /tmp/v21/a/rxep-exact-decimal-partial-aggregate.json /tmp/v21/final/
          cp /tmp/v21/a/rxep-exact-decimal-partial-aggregate-receipt.json /tmp/v21/final/

      - name: Retain bounded v2.1 evidence only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v21-rxep-partial-aggregate
          path: /tmp/v21/final/
          if-no-files-found: error
          retention-days: 30
