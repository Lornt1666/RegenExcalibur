name: ProofGrid v0.9.1 Exact v1.2 Stack Pin

on:
  pull_request:
    paths:
      - '.github/workflows/proofgrid-v091-v12-stack-pin.yml'
      - 'reference/environmental_admission_v091.py'
      - 'tests/test_environmental_admission_v091.py'
      - 'tests/test_environmental_admission.py'
      - 'requirements-proofgrid.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-v12-stack-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6.1.0

      - name: Setup Python 3.11.16
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11.16'

      - name: Setup Java 17
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ProofGrid dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proofgrid.txt
          python -m pip check

      - name: Run exact-stack consumer adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_environmental_admission_v091

      - name: Resolve published validator/profile artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/proofgrid-v091
          mkdir -p "$OUT"
          cat > "$OUT/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>proofgrid.v091</groupId>
            <artifactId>exact-v12-stack-pin</artifactId>
            <version>0.9.1</version>
            <dependencies>
              <dependency>
                <groupId>com.okworx.ilcd.validation</groupId>
                <artifactId>ilcd-validation</artifactId>
                <version>2.12.2</version>
              </dependency>
              <dependency>
                <groupId>com.okworx.ilcd.validation.profiles</groupId>
                <artifactId>EPD-1.2-OEKOBAUDAT</artifactId>
                <version>3.8.0</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn -B -ntp -f "$OUT/pom.xml" dependency:go-offline

          LIB_DIR="$HOME/.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2"
          PROF_DIR="$HOME/.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0"
          LIB="$LIB_DIR/ilcd-validation-2.12.2.jar"
          LIB_POM="$LIB_DIR/ilcd-validation-2.12.2.pom"
          PROFILE="$PROF_DIR/EPD-1.2-OEKOBAUDAT-3.8.0.jar"
          PROFILE_POM="$PROF_DIR/EPD-1.2-OEKOBAUDAT-3.8.0.pom"

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          from reference import environmental_admission_v091 as a

          home=Path.home()
          lib_dir=home/'.m2/repository/com/okworx/ilcd/validation/ilcd-validation/2.12.2'
          prof_dir=home/'.m2/repository/com/okworx/ilcd/validation/profiles/EPD-1.2-OEKOBAUDAT/3.8.0'
          lib=lib_dir/'ilcd-validation-2.12.2.jar'
          lib_pom=lib_dir/'ilcd-validation-2.12.2.pom'
          profile=prof_dir/'EPD-1.2-OEKOBAUDAT-3.8.0.jar'
          profile_pom=prof_dir/'EPD-1.2-OEKOBAUDAT-3.8.0.pom'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          with zipfile.ZipFile(profile) as z:
              generic=hashlib.sha256(z.read('includes/EPD-1.2-Generic.jar')).hexdigest()
              en15804=hashlib.sha256(z.read('includes/EPD-1.2-EN15804.jar')).hexdigest()
          observed={
            'validator':{
              'coordinate':'com.okworx.ilcd.validation:ilcd-validation:2.12.2',
              'jar_sha256':sha(lib),
              'pom_sha256':sha(lib_pom),
            },
            'profile':{
              'coordinate':'com.okworx.ilcd.validation.profiles:EPD-1.2-OEKOBAUDAT:3.8.0',
              'jar_sha256':sha(profile),
              'pom_sha256':sha(profile_pom),
            },
            'included_profiles':{
              'EPD-1.2-Generic.jar':generic,
              'EPD-1.2-EN15804.jar':en15804,
            },
          }
          assert observed == a.EXPECTED_V12_STACK, (observed, a.EXPECTED_V12_STACK)
          payload={
            'verdict':'V12_VALIDATOR_PROFILE_STACK_PIN_VERIFIABLE',
            'consumer_version':'0.9.1',
            'official_stack':observed,
            'official_stack_sha256':a.EXPECTED_V12_STACK_SHA256,
            'research_anchors':{
              'v08_library_research_receipt_sha256':'78d296dad1e00747b75bcaeaf5c6eb5611354fd960c98416142fcaedee054f17',
              'v08_authority_safe_profile_receipt_sha256':'93019e0936c1110d271066b04a5a744e3273fd32911cd2606da0d4af463fed91',
            },
            'certified':False,
            'limitations':[
              'This receipt proves exact artifact identity and consumer pinning only; it is not certification or scientific validation.',
              'Dataset-specific profile compatibility still requires a bound zero-error conformance receipt for the exact source package.'
            ]
          }
          body=dict(payload)
          payload['receipt_sha256']=a.sha256_bytes(a.canonical_json_bytes(body))
          out=Path('/tmp/proofgrid-v091')
          (out/'observed-official-stack.json').write_text(json.dumps(observed,indent=2,sort_keys=True)+'\n')
          (out/'v091-stack-pin-receipt.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print('V091_EXACT_STACK_PIN=PASS')
          print('official_stack_sha256=',a.EXPECTED_V12_STACK_SHA256)
          print('receipt_sha256=',payload['receipt_sha256'])
          PY

      - name: Prove hardened consumer accepts exact stack and rejects forged stack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, tempfile
          from datetime import date
          from pathlib import Path
          from reference import environmental_admission_v091 as a
          from tests.test_environmental_admission import AdmissionFixture
          from tests.test_environmental_admission_v091 import v12_receipt, seal

          with tempfile.TemporaryDirectory() as td:
              fx=AdmissionFixture(Path(td),'1.2',zipped=True)
              pre=a.preflight(fx.root,as_of=date(2026,8,20))
              conf=v12_receipt(pre)
              final=a.finalize(pre,conf)
              assert final['admitted'] is True
              assert final['conformance']['official_stack']==a.EXPECTED_V12_STACK
              forged=copy.deepcopy(conf)
              forged['official_stack']['validator']['jar_sha256']='f'*64
              forged=seal(forged)
              try:
                  a.finalize(pre,forged)
              except a.AdmissionError:
                  pass
              else:
                  raise AssertionError('forged validator hash was accepted')
              out=Path('/tmp/proofgrid-v091')
              (out/'positive-admission-receipt.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
          print('V091_FORGED_STACK_REJECTION=PASS')
          PY

      - name: Retain v0.9.1 trust receipts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: proofgrid-v091-exact-v12-stack-pin
          path: |
            /tmp/proofgrid-v091/observed-official-stack.json
            /tmp/proofgrid-v091/v091-stack-pin-receipt.json
            /tmp/proofgrid-v091/positive-admission-receipt.json
          if-no-files-found: error
          retention-days: 30
